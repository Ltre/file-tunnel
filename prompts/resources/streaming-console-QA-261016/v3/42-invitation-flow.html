:16px}.recipient select{width:auto;max-width:100%}.notification{align-items:flex-start}.notification-actions{display:flex;gap:7px;margin-top:12px}.notification-actions button{padding:6px 10px;min-height:35px}.message{max-width:850px;margin:0 auto;background:#fff;border:1px solid #dfe4eb;border-radius:10px;padding:22px}.message-head{display:flex;gap:10px;align-items:center;margin-bottom:18px}.message-head .meta{font-size:12px;color:#87909c}.markdown{position:relative;overflow:hidden;overflow-wrap:anywhere;line-height:1.75rem;font-size:14px}.markdown.folded{max-height:17.5rem}.markdown h3{font-size:18px;line-height:1.75rem;margin:0 0 .875rem}.markdown p{margin:0 0 .875rem}.markdown a{color:#32668f}.markdown ul{margin:0 0 .875rem;padding-left:23px}.markdown .asset{background:#f0f4f7;border:1px solid #e0e7ef;border-radius:6px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin:12px 0}.markdown .asset span{font-size:25px}.markdown .asset small{line-height:1.6}.blur-tail{display:none;position:absolute;bottom:0;left:0;width:100%;height:4rem;border:0;border-radius:0;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);background:linear-gradient(transparent,#ffffffde);color:#4b5d76;align-items:flex-end;padding-bottom:8px}.folded .blur-tail{display:flex}.expand{width:100%;margin:12px 0}.message footer{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid #edf0f3;margin-top:18px;padding-top:15px}.file-tree{white-space:pre-wrap;background:#f4f6f8;border-radius:7px;padding:15px;font:12px/1.9 ui-monospace,monospace;overflow-wrap:anywhere}.event{border-left:3px solid #ccd8e7;padding:9px 12px;margin-top:14px;background:#f6f8fb;font-size:13px;color:#54687e}.small-link{color:#54687e;text-decoration:underline}.modal{position:fixed;inset:0;z-index:10;background:#141f2f66;display:grid;place-items:center;padding:20px}.modal-card{background:white;border-radius:10px;max-width:520px;width:100%;max-height:calc(100dvh - 40px);overflow:auto;padding:24px}.modal-card h2{margin:0 0 16px;font-size:20px}.modal-card .between{margin-bottom:12px}.modal-card .between button{min-height:32px;padding:3px 10px}#feedback{min-height:1.6em;color:#49667a;font-size:13px;margin-top:16px}.review button{min-height:30px;padding:4px 9px;font-size:12px}.review .row{justify-content:space-between;flex-wrap:wrap}.path{overflow-wrap:anywhere}.scenario{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.scenario button{font-size:12px;padding:5px 10px;min-height:33px}.scenario button[aria-pressed=true]{background:#eef2f8;border-color:#bdcadb}button[hidden],[hidden]{display:none!important}

<body>
<header class="top"><div class="top-row"><div><h1>邀请与隧道 Markdown 消息</h1><p class="muted">v3 补充交互：创建仅邀请台后选设备发送，从通知中心接受，或将邀请转发为隧道消息。</p></div><a class="button" id="back-link" href="index.html#09-access">← 返回 v3 原型</a></div></header>
<div class="review"><div class="row"><span>原型审核工具（非产品菜单）· 下方各页分别展示发起设备 A 或接收设备 B 的本机界面，不提供管理其它设备通知的功能。</span><button id="reset">重置演示</button></div><div class="scenario" aria-label="演示流程"><button data-start="direct">演示一：定向邀请</button><button data-start="tunnel">演示二：转发到隧道</button><button data-start="decline">演示三：拒绝邀请</button></div></div>
<div class="layout"><aside><section class="station"><small>串流台来源 · 书房电脑</small><h2>06 · 周末观影台</h2><span class="tag">仅限邀请</span></section><p class="muted" style="font-size:12px;margin:20px 10px 0">原型审核页面导航</p><nav class="nav" aria-label="原型审核页面"><a href="#devices">① 发起端：邀请设备</a><a href="#notifications">② 接收端：本机通知</a><a href="#tunnel">③ 发起端：转发邀请</a><a href="#message">④ 接收端：邀请消息</a><a href="#markdown">⑤ 普通 Markdown 示例</a><small>邀请可附带媒体缩略图；普通 Markdown 的附件演示单独展示。</small></nav></aside><main class="main" id="main"></main></div>
<div id="modal-root"></div>
<script>
'use strict';
// 仅用于检验邀请、通知和消息之间的交互；全部状态在内存中。
const devices=[{id:'B',name:'客厅平板',relation:'已关注 · 在其它隧道'},{id:'C',name:'我的手机',relation:'当前同隧道'},{id:'D',name:'工作笔记本',relation:'已关注 · 在其它隧道'}];
// 接收端页面只有一个固定的本机身份，不存在查看或切换其它设备通知的操作。
const localReceiver={id:'B',name:'客厅平板'};
const tunnels=[{id:'family',name:'家庭分享',code:'A7K2Q'},{id:'work',name:'工作交流',code:'B8N3W'}];
const sampleMarkdown='# 串流台邀请\n\n**书房电脑 · 06 · 周末观影台**\n\n邀请你一起观看。\n\n[查看并接受邀请](https://example.invalid/stream-invite/demo)';
// 独立的普通消息示例：这些附件由消息作者引用，既不是串流源，也不会加入邀请消息。
const resourceMarkdown='# 活动签到说明\n\n**这是一条普通 Markdown 消息，与串流邀请无关。**\n\n## 到场安排\n\n请在入口完成签到。\n活动说明可以直接在本条消息中展开阅读。\n\n## 场地说明\n\n![场地示意图](tunnel-blob:room-map)\n\n[路线说明.mp4](tunnel-blob:route-video)\n\n## 注意事项\n\n- 上述图片和视频是作者自行引用的隧道资源。\n- 不引用网盘资源。\n- 下载或存到网盘时，与正文一起打包。\n- 此处仅演示普通消息的预览和附件打包范围。';
function initial(){return {selected:[],invites:[],tunnel:'family',messages:[],expanded:false,feedback:'',feedbackFor:'sender',scenario:'direct',modal:null,exportType:null,markdown:sampleMarkdown,tunnelJoined:false,attachThumbnail:true};}
// 纯状态转换：界面只派发动作，不接入任何正式接口。
function reduce(s,a){switch(a.type){
 case 'select':return {...s,selected:a.checked?[...new Set([...s.selected,a.id])]:s.selected.filter(x=>x!==a.id)};
 case 'thumbnail':return {...s,attachThumbnail:a.checked};
 case 'send':{const added=s.selected.filter(id=>!s.invites.some(x=>x.device===id&&x.status==='待接受')).map((id,i)=>({id:s.invites.length+i+1,device:id,status:'待接受',thumbnail:s.attachThumbnail}));return {...s,invites:[...s.invites,...added],feedbackFor:'sender',feedback:added.length?`已向 ${added.length} 台设备发送演示邀请，等待对方接受。`:'这些设备已有待接受邀请，未重复发送。'};}
 case 'respond':return {...s,invites:s.invites.map(x=>x.id===a.id&&x.device===localReceiver.id?{...x,status:a.accept?'已接受':'已拒绝'}:x),modal:null,feedbackFor:'receiver',feedback:a.accept?'演示：本机已接受邀请并订阅，可打开当前台。':'演示：本机已拒绝邀请，未创建订阅。'};
 case 'join-tunnel':return {...s,tunnelJoined:true,modal:'watch',feedbackFor:'receiver',feedback:'本机已通过隧道消息中的邀请加入串流台。'};
 case 'tunnel':return {...s,tunnel:a.id};
 case 'markdown':return {...s,markdown:a.text};
 case 'forward':return {...s,messages:[...s.messages,{id:s.messages.length+1,tunnel:s.tunnel,purpose:'stream-invitation',text:s.markdown,thumbnail:s.attachThumbnail}],expanded:false,feedbackFor:'sender',feedback:`已将邀请发送到“${tunnels.find(x=>x.id===s.tunnel).name}”（演示），等待对方接受。`};
 case 'expand':return {...s,expanded:!s.expanded};
 case 'modal':return {...s,modal:a.modal};
 case 'export':return {...s,exportType:a.kind,modal:'export'};
 case 'reset':return initial();
 case 'start':return {...initial(),scenario:a.kind,selected:a.kind==='tunnel'?[]:['B']};
 default:return s;
}}
let state=initial();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>devices.find(x=>x.id===id);
const status=s=>`<span class="tag ${s==='已接受'?'good':s==='待接受'?'pending':''}">${esc(s)}</span>`;
function dispatch(a,renderNow=true){state=reduce(state,a);if(renderNow)render();}
function route(){return ['devices','notifications','tunnel','message','markdown'].includes(location.hash.slice(1))?location.hash.slice(1):'devices';}
function go(id){if(route()===id)render();else location.hash=id;}
function statePanel(){const receiver=route()==='notifications',rows=receiver?state.invites.filter(x=>x.device===localReceiver.id):state.invites;return `<section class="card state"><h3>${receiver?'本机邀请状态':'发起端邀请状态'}</h3><dl><dt>本机设备</dt><dd>${receiver?localReceiver.name:'书房电脑'}</dd><dt>串流台</dt><dd>书房电脑 · 06<br>周末观影台</dd><dt>可见性</dt><dd>仅限邀请</dd><dt>${receiver?'本机收到':'本机发出'}</dt><dd>待接受 ${rows.filter(x=>x.status==='待接受').length} · 已接受 ${rows.filter(x=>x.status==='已接受').length} · 已拒绝 ${rows.filter(x=>x.status==='已拒绝').length}</dd></dl><p class="note">${receiver?'这里只显示当前设备自己的邀请，不读取其它设备的通知。':'这里只显示本机发出的邀请及其接受状态。'}</p></section>`;}
function feedback(){const side=['notifications','message'].includes(route())?'receiver':'sender',text=route()!=='markdown'&&state.feedbackFor===side?state.feedback:'';return `<section id="feedback" class="status-panel" role="status" aria-live="polite" ${text?'':'hidden'}><span class="status-icon" aria-hidden="true">✓</span><div>${esc(text)}</div></section>`;}
function mediaThumbnail(){return `<figure class="invite-thumbnail" aria-label="媒体内容缩略图（原型示意）"><svg viewBox="0 0 480 270" role="img" aria-label="海岸风景视频缩略图"><rect width="480" height="270" fill="#dbe8ed"/><path d="M0 128L110 59L225 143L349 86L480 145V270H0Z" fill="#89a8b4"/><path d="M0 177Q120 148 245 180T480 169V270H0Z" fill="#567e91"/><path d="M0 234Q134 194 259 220T480 207V270H0Z" fill="#bed3d5"/><circle cx="385" cy="52" r="23" fill="#f2dfb5"/><circle cx="240" cy="135" r="28" fill="#183342aa"/><path d="M233 121L254 135L233 149Z" fill="#fff"/></svg><figcaption>内容缩略图 · 示意</figcaption></figure>`;}
function thumbnailOption(){return `<label class="thumbnail-option"><input type="checkbox" data-thumbnail ${state.attachThumbnail?'checked':''}>附带媒体缩略图</label>`;}
function devicesView(){return `<h2>邀请可见设备</h2><p class="intro">本机：书房电脑。已创建“仅限邀请”串流台，可邀请看得见的其它设备。</p><div class="columns"><div><section class="card"><div class="between wrap"><h3>选择接收设备</h3><span class="tag">不要求同隧道</span></div>${devices.map(d=>`<label class="device"><input type="checkbox" data-device="${d.id}" ${state.selected.includes(d.id)?'checked':''}><span class="glyph">${d.id==='B'?'▤':d.id==='C'?'▯':'▣'}</span><span class="grow"><strong>${d.name}</strong><small>${d.relation}</small></span><span class="status">${state.invites.find(x=>x.device===d.id&&x.status==='待接受')?'邀请待接受':'在线'}</span></label>`).join('')}${thumbnailOption()}<div class="actions"><button class="primary" data-action="send" ${state.selected.length?'':'disabled'}>发送邀请（${state.selected.length}）</button></div>${feedback()}</section><section class="card"><h3>也可以通过其它渠道转交</h3><div class="copyline"><code>https://example.invalid/stream-invite/demo</code><button data-action="link">查看邀请链接</button></div><div class="actions"><button data-go="tunnel">转发到隧道</button><button data-action="code">查看邀请码</button></div><small>示例链接不可用于真实加入；保留原 v3 的链接与邀请码入口。</small></section></div>${statePanel()}</div>`;}
function notificationsView(){const rows=state.invites.filter(x=>x.device===localReceiver.id);return `<h2>通知中心</h2><p class="intro">本机：${localReceiver.name}。这里只显示发给本机的通知。</p><div class="columns"><section class="card"><h3>串流台邀请</h3>${rows.length?rows.map(x=>`<article class="notification"><span class="glyph">✉</span><div class="grow"><div class="between wrap"><strong>书房电脑邀请你观看串流台</strong>${status(x.status)}</div><p>06 · 周末观影台 <span class="tag">仅限邀请</span></p><small>来自站内定向邀请</small>${x.thumbnail?mediaThumbnail():''}<div class="notification-actions">${x.status==='待接受'?`<button class="primary" data-open="${x.id}">查看邀请</button><button data-reject="${x.id}">拒绝</button>`:x.status==='已接受'?'<button data-action="watch">打开串流台</button>':'<span class="muted">没有订阅该台</span>'}</div></div></article>`).join(''):'<div class="empty">暂无发给本机的串流邀请。</div>'}${feedback()}</section>${statePanel()}</div>`;}
function tunnelView(){return `<h2>转发串流邀请到隧道</h2><p class="intro">本机：书房电脑。选择隧道，发送邀请说明和链接，可附带媒体缩略图。</p><div class="columns"><div><section class="card"><h3>目标隧道</h3>${tunnels.map(t=>`<label class="tunnel"><input type="radio" name="tunnel" value="${t.id}" ${state.tunnel===t.id?'checked':''}><span class="glyph">⇄</span><span class="grow"><strong>${t.name}</strong><small>${t.code} · 本设备可发送</small></span></label>`).join('')}</section><section class="card"><label class="field"><span>邀请说明与链接</span><textarea id="markdown-editor" spellcheck="false">${esc(state.markdown)}</textarea></label>${thumbnailOption()}<div class="actions"><button class="primary" data-action="forward" ${state.markdown.trim()?'':'disabled'}>发送邀请</button></div>${feedback()}</section></div>${statePanel()}</div>`;}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,url)=>url==='https://example.invalid/stream-invite/demo'?`<a href="#message" data-action="tunnel-invite">${label}</a>`:`<span>${label} <small>引用：${url}</small></span>`);}
const assetInfo={'tunnel-blob:room-map':['▧','场地示意图.jpg','图片 · 作者自行引用的隧道资源'],'tunnel-blob:route-video':['▶','路线说明.mp4','视频 · 作者自行引用的隧道资源']};
function markdownBody(text){return text.split('\n').map(line=>{const image=line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/),link=line.match(/^\[([^\]]+)\]\((tunnel-blob:[^)]+)\)$/),match=image||link;if(match){const a=assetInfo[match[2]];return a?`<div class="asset"><span>${a[0]}</span><div><strong>${a[1]}</strong><small>${a[2]} · 仅演示引用</small></div></div>`:`<p>${esc(line)}</p>`;}if(line.startsWith('# '))return `<h3>${inline(line.slice(2))}</h3>`;if(line.startsWith('## '))return `<p><strong>${inline(line.slice(3))}</strong></p>`;if(line.startsWith('- '))return `<p>• ${inline(line.slice(2))}</p>`;return line?`<p>${inline(line)}</p>`:'';}).join('');}
function currentMessage(){return route()==='markdown'?{tunnel:'family',purpose:'ordinary',text:resourceMarkdown}:state.messages.at(-1);}
function messageView(){const msg=currentMessage(),generic=msg?.purpose==='ordinary';return `<h2>${generic?'普通 Markdown 消息示例':'隧道中的串流邀请'}</h2><p class="intro">${generic?'独立演示普通消息的十行预览、展开和附件打包，与串流邀请无关。':'本机：客厅平板。邀请展示说明、链接及可选缩略图，不附带串流源文件。'}</p>${msg?`<article class="message"><header class="message-head"><span class="glyph">M↓</span><div class="grow"><strong>书房电脑</strong><div class="meta">${tunnels.find(t=>t.id===msg.tunnel).name} · Markdown · 刚刚</div></div><span class="tag">${generic?'Markdown':'串流邀请'}</span></header>${!generic&&msg.thumbnail?`<button class="invite-thumbnail-button" data-action="tunnel-invite" aria-label="查看串流邀请">${mediaThumbnail()}</button>`:''}<div class="markdown ${state.expanded?'':'folded'}" id="markdown-body">${markdownBody(msg.text)}<button class="blur-tail" data-action="expand" aria-label="展开查看完整 Markdown">展开完整 Markdown ↓</button></div><button class="expand" data-action="expand">${state.expanded?'收起消息 ↑':'展开查看完整内容 ↓'}</button>${generic?'<footer><button data-export="download">⇩ 下载</button><button data-export="drive">▤ 上传到网盘</button></footer><small>只打包正文及作者在这条消息中引用的资源。</small>':''}</article>`:'<div class="empty">暂无串流邀请消息。</div>'}${feedback()}`;}
function modal(){if(!state.modal)return '';let title,body,buttons='';const inv=typeof state.modal==='number'?state.invites.find(x=>x.id===state.modal&&x.device===localReceiver.id):null;
 if(inv){title='核对串流台邀请';body=`<p><strong>书房电脑 · 06 · 周末观影台</strong></p>${inv.thumbnail?mediaThumbnail():''}<p>接收设备：${byId(inv.device).name}</p><p>观看当前台所选资源，无需来源网盘账号；不授予浏览来源网盘的权限。</p><p class="muted">邀请有效期和离线送达规则尚未确认。</p>`;buttons=`<button data-reject="${inv.id}">拒绝</button><button class="primary" data-accept="${inv.id}">接受邀请并订阅</button>`;}
 else if(state.modal==='tunnel-invite'){title='来自隧道消息的邀请';body='<p><strong>书房电脑 · 06 · 周末观影台</strong></p><p>你可以直接接受此邀请，无需创建者另行单独批准。</p>';buttons=state.tunnelJoined?'<button class="primary" data-action="watch">打开串流台</button>':'<button data-action="close">返回</button><button class="primary" data-action="join-tunnel">接受邀请并订阅</button>';}
 else if(state.modal==='export'){const msg=currentMessage(),refs=Object.keys(assetInfo).filter(key=>msg?.text.includes(key));title=state.exportType==='drive'?'上传到网盘 · 打包示意':'下载 · 打包示意';body=`<p>活动说明.zip</p><div class="file-tree">活动说明.md${refs.map(key=>'\nassets/'+assetInfo[key][1]).join('')}</div><p class="muted">仅包括正文及这条普通消息中作者自行引用的附件。本原型不读取文件、不生成真实 ZIP、不进行上传。</p>`;}
 else if(state.modal==='watch'){title='已订阅当前串流台';body='<div class="empty">▣<br>周末观影台 · 仅限邀请<br>此处为观看入口示意，不播放真实媒体。</div>';}
 else {title=state.modal==='code'?'示例邀请码':'示例邀请链接';body=`<p class="path">${state.modal==='code'?'DEMO-7F4K-Q8HJ':'https://example.invalid/stream-invite/demo'}</p><small>仅用于原型，不生成真实邀请凭据。</small>`;}
 return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><section class="modal-card"><div class="between"><h2 id="dialog-title">${title}</h2><button data-action="close" aria-label="关闭对话框">×</button></div>${body}${buttons?`<div class="actions">${buttons}</div>`:''}</section></div>`;
}
function render(){const id=route();document.querySelectorAll('.nav a').forEach(a=>a.setAttribute('aria-current',a.hash==='#'+id?'page':'false'));document.querySelectorAll('[data-start]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.start===state.scenario)));document.getElementById('main').innerHTML=({devices:devicesView,notifications:notificationsView,tunnel:tunnelView,message:messageView,markdown:messageView})[id]();document.getElementById('modal-root').innerHTML=modal();const md=document.getElementById('markdown-body');if(md){const overflow=md.scrollHeight>parseFloat(getComputedStyle(md).lineHeight)*10+1;document.querySelector('.expand').hidden=!overflow;md.querySelector('.blur-tail').hidden=!overflow;if(!overflow)md.classList.remove('folded');}const close=document.querySelector('[data-action=close]');if(close)close.focus();}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.device)dispatch({type:'select',id:t.dataset.device,checked:t.checked});if(t.hasAttribute('data-thumbnail'))dispatch({type:'thumbnail',checked:t.checked});if(t.name==='tunnel')dispatch({type:'tunnel',id:t.value});});
document.addEventListener('input',e=>{if(e.target.id==='markdown-editor'){dispatch({type:'markdown',text:e.target.value},false);const b=document.querySelector('[data-action=forward]');if(b)b.disabled=!e.target.value.trim();}});
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.go){go(b.dataset.go);return;}if(b.id==='reset'){dispatch({type:'reset'});go('devices');return;}if(b.dataset.start){dispatch({type:'start',kind:b.dataset.start});go(b.dataset.start==='tunnel'?'tunnel':'devices');return;}if(b.dataset.open){dispatch({type:'modal',modal:Number(b.dataset.open)});return;}if(b.dataset.accept||b.dataset.reject){dispatch({type:'respond',id:Number(b.dataset.accept||b.dataset.reject),accept:!!b.dataset.accept});return;}if(b.dataset.export){dispatch({type:'export',kind:b.dataset.export});return;}switch(b.dataset.action){case 'send':dispatch({type:'send'});break;case 'forward':dispatch({type:'forward'});break;case 'join-tunnel':dispatch({type:'join-tunnel'});break;case 'expand':dispatch({type:'expand'});break;case 'close':dispatch({type:'modal',modal:null});break;case 'link':case 'code':case 'watch':dispatch({type:'modal',modal:b.dataset.action});break;case 'tunnel-invite':e.preventDefault();dispatch({type:'modal',modal:'tunnel-invite'});break;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)dispatch({type:'modal',modal:null});});
window.addEventListener('hashchange',render);
if(new URLSearchParams(location.search).get('from')==='mobile')document.getElementById('back-link').href='mobile/index.html#09-access';
render();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><title>浏览器共享来源选择示意</title><defs><linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a8a8a8"/><stop offset="1" stop-color="#666666"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity=".16"/></filter></defs><rect x="0" y="0" width="1600" height="970" rx="0" fill="url(#warm)" stroke="none" /><text x="32" y="41" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#737373" >← 返回  /  创建串流台  /  屏幕共享</text><a href="02-discovery.svg" aria-label="返回串流控制台"><rect x="28" y="15" width="205" height="37" fill="transparent"/></a><rect x="1389" y="18" width="179" height="36" rx="5" fill="#ffffff" stroke="#dedede" /><text x="1478.5" y="41" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#262626" >← 返回首页</text><a href="22-home-background.svg" aria-label="← 返回首页"><rect x="1389" y="18" width="179" height="36" fill="transparent"/></a><text x="32" y="103" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#262626" >配置屏幕共享串流台</text><text x="32" y="133" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#737373" >实时采集为独立来源；保存配置后，由当前发起设备主动授权并开始。</text><rect x="32" y="158" width="185" height="36" rx="5" fill="#ffffff" stroke="#dedede" /><text x="124.5" y="181" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#262626" >文件播放列表</text><a href="03-create-edit.svg" aria-label="文件播放列表"><rect x="32" y="158" width="185" height="36" fill="transparent"/></a><rect x="229" y="158" width="185" height="36" rx="5" fill="#ffffff" stroke="#dedede" /><text x="321.5" y="181" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#262626" >摄像头</text><a href="14-camera.svg" aria-label="摄像头"><rect x="229" y="158" width="185" height="36" fill="transparent"/></a><rect x="426" y="158" width="185" height="36" rx="5" fill="#404040" stroke="#404040" /><text x="518.5" y="181" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff" >屏幕共享</text><a href="15-screen.svg" aria-label="屏幕共享"><rect x="426" y="158" width="185" height="36" fill="transparent"/></a><rect x="32" y="221" width="977" height="585" rx="6" fill="#ffffff" stroke="#dedede" /><text x="50" y="251" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#262626" >采集预览</text><rect x="52" y="274" width="937" height="364" rx="4" fill="#e9e9e9" stroke="#dedede" /><g transform="translate(491 365) scale(1.875)" fill="none" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="28" height="20" rx="2"/><path d="M16 24v6M9 30h14"/></g><text x="520" y="473" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" font-weight="600" text-anchor="middle" fill="#737373" >尚未选择共享屏幕</text><text x="520" y="512" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#737373" >采集不会随打开页面或复用模板自动开始。</text><rect x="52" y="671" width="286" height="44" rx="5" fill="#404040" stroke="#404040" /><text x="195" y="698" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff" >选择屏幕并开始共享</text><a href="21-screen-permission.svg" aria-label="选择屏幕并开始共享"><rect x="52" y="671" width="286" height="44" fill="transparent"/></a><rect x="353" y="671" width="213" height="44" rx="5" fill="#ffffff" stroke="#dedede" /><text x="459.5" y="698" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#262626" >返回来源选择</text><a href="04-source-drive.svg" aria-label="返回来源选择"><rect x="353" y="671" width="213" height="44" fill="transparent"/></a><text x="52" y="754" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#737373" >支持整个屏幕、窗口或标签页；实际选项由浏览器提供。</text><text x="52" y="779" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#737373" >是否能共享声音，由浏览器与所选来源决定。</text><rect x="1027" y="221" width="541" height="585" rx="6" fill="#ffffff" stroke="#dedede" /><text x="1045" y="251" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#262626" >台配置</text><text x="1047" y="292" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#737373" >台号 / 名称</text><rect x="1047" y="302" width="501" height="37" rx="7" fill="#fff" stroke="#dedede" /><text x="1059" y="326" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#262626" >02 · 书桌屏幕</text><text x="1047" y="383" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#737373" >共享范围</text><rect x="1047" y="393" width="501" height="37" rx="7" fill="#fff" stroke="#dedede" /><text x="1059" y="417" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#262626" >点击左侧按钮后由浏览器选择</text><text x="1047" y="474" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#737373" >共享音频</text><rect x="1047" y="484" width="501" height="37" rx="7" fill="#fff" stroke="#dedede" /><text x="1059" y="508" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#262626" >在浏览器选择器中选择（若支持）</text><text x="1047" y="579" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#737373" >可见性</text><circle cx="1056" cy="611" r="8" fill="#ffffff" stroke="#737373"/><text x="1075" y="616" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#262626" >公开</text><circle cx="1197" cy="611" r="8" fill="#ffffff" stroke="#262626"/><circle cx="1197" cy="611" r="4" fill="#262626" stroke="none"/><text x="1216" y="616" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#262626" >仅限邀请</text><text x="1047" y="661" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#737373" >当前文件播放列表仍保留，可切换回来复用。</text><rect x="1047" y="728" width="501" height="44" rx="5" fill="#ffffff" stroke="#dedede" /><text x="1297.5" y="755" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#262626" >只保存配置</text><a href="10-my-stations.svg" aria-label="只保存配置"><rect x="1047" y="728" width="501" height="44" fill="transparent"/></a><rect x="32" y="838" width="1536" height="48" rx="5" fill="#f1f1f1" stroke="none" /><circle cx="53" cy="862" r="8" fill="#737373" stroke="none"/><text x="53" y="866" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" >i</text><text x="73" y="867" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#262626" >实时来源使用 LIVE 状态，不显示文件进度条、拖动、快进或快退；接收端可暂停本机观看。</text><rect x="0" y="0" width="1600" height="970" rx="0" fill="#000000" stroke="none" opacity=".36"/><rect x="384" y="195" width="832" height="568" rx="6" fill="#ffffff" stroke="#dedede" /><text x="402" y="225" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#262626" >浏览器 / 系统选择器示意</text><text x="408" y="270" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#262626" >选择要共享的内容</text><text x="408" y="305" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#737373" >以下是浏览器原生界面的示意，具体样式随设备变化。</text><rect x="408" y="336" width="181" height="36" rx="5" fill="#ffffff" stroke="#dedede" /><text x="498.5" y="359" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#262626" >整个屏幕</text><a href="21-screen-permission.svg" aria-label="整个屏幕"><rect x="408" y="336" width="181" height="36" fill="transparent"/></a><rect x="601" y="336" width="181" height="36" rx="5" fill="#404040" stroke="#404040" /><text x="691.5" y="359" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff" >窗口</text><a href="21-screen-permission.svg" aria-label="窗口"><rect x="601" y="336" width="181" height="36" fill="transparent"/></a><rect x="794" y="336" width="181" height="36" rx="5" fill="#ffffff" stroke="#dedede" /><text x="884.5" y="359" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#262626" >标签页</text><a href="21-screen-permission.svg" aria-label="标签页"><rect x="794" y="336" width="181" height="36" fill="transparent"/></a><rect x="408" y="394" width="247" height="170" rx="5" fill="#eeeeee" stroke="#262626" /><g transform="translate(513 426) scale(1.125)" fill="none" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="28" height="20" rx="2"/><path d="M16 24v6M9 30h14"/></g><text x="532" y="533" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#262626" >项目演示窗口</text><rect x="671" y="394" width="247" height="170" rx="5" fill="#fafafa" stroke="#dedede" /><g transform="translate(776 426) scale(1.125)" fill="none" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="28" height="20" rx="2"/><path d="M16 24v6M9 30h14"/></g><text x="795" y="533" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#262626" >浏览器窗口</text><rect x="934" y="394" width="247" height="170" rx="5" fill="#fafafa" stroke="#dedede" /><g transform="translate(1039 426) scale(1.125)" fill="none" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="28" height="20" rx="2"/><path d="M16 24v6M9 30h14"/></g><text x="1058" y="533" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#262626" >桌面窗口</text><rect x="408" y="602" width="16" height="16" rx="3" fill="#404040" stroke="#404040" /><text x="416" y="614" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" >✓</text><text x="435" y="616" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#262626" >共享音频（当前浏览器与来源支持时）</text><text x="408" y="656" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#737373" >只共享你选择的内容；随时可从浏览器停止。</text><rect x="858" y="696" width="153" height="42" rx="5" fill="#ffffff" stroke="#dedede" /><text x="934.5" y="722" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#262626" >取消</text><a href="15-screen.svg" aria-label="取消"><rect x="858" y="696" width="153" height="42" fill="transparent"/></a><rect x="1026" y="696" width="165" height="42" rx="5" fill="#404040" stroke="#404040" /><text x="1108.5" y="722" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff" >共享</text><a href="32-live-active.svg" aria-label="共享"><rect x="1026" y="696" width="165" height="42" fill="transparent"/></a><rect x="0" y="970" width="1600" height="90" rx="8" fill="#ffffff" stroke="none" /><line x1="0" y1="970" x2="1600" y2="970" stroke="#dedede" stroke-width="1" /><text x="30" y="1000" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#262626" >21 / 浏览器共享来源选择示意</text><text x="30" y="1030" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#737373" >浏览器选择器仅为示意，实际可选屏幕、窗口、标签页与音频能力因设备而异。</text><text x="1570" y="1000" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#404040" >全屏浮层 · v3</text></svg>
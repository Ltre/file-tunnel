17" height="45" fill="transparent"/></a><text x="35" y="298" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#302a22" >观看者</text><a href="06-owner.svg" aria-label="观看者"><rect x="16" y="269" width="217" height="45" fill="transparent"/></a><rect x="16" y="328" width="217" height="45" rx="8" fill="#f5ead4" stroke="none" /><text x="35" y="357" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#302a22" >邀请与可见性</text><a href="09-access.svg" aria-label="邀请与可见性"><rect x="16" y="328" width="217" height="45" fill="transparent"/></a><text x="35" y="416" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#302a22" >下线与恢复</text><a href="19-recovery.svg" aria-label="下线与恢复"><rect x="16" y="387" width="217" height="45" fill="transparent"/></a><line x1="1140" y1="73" x2="1140" y2="944" stroke="#e6dac4" stroke-width="1" /><text x="275" y="110" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#302a22" >邀请与可见性管理</text><text x="275" y="140" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#8a7c67" >管理本台的可见性、邀请以及已授权的订阅设备。</text><text x="275" y="196" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#302a22" >串流台可见性</text><rect x="275" y="216" width="262" height="115" rx="6" fill="#fffaef" stroke="#e6dac4" /><g transform="translate(290 236) scale(0.96875)" fill="none" stroke="#302a22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16Q16 0 30 16 16 32 2 16z"/><circle cx="16" cy="16" r="5"/></g><text x="335" y="260" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#302a22" >公开</text><text x="290" y="303" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >同隧道与已关注设备可发现。</text><a href="02-discovery.svg" aria-label="公开"><rect x="275" y="216" width="262" height="115" fill="transparent"/></a><rect x="555" y="216" width="262" height="115" rx="6" fill="#fff2d8" stroke="#302a22" /><g transform="translate(570 236) scale(0.96875)" fill="none" stroke="#302a22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="9" r="5"/><path d="M5 29v-4q0-8 11-8t11 8v4z"/></g><text x="615" y="260" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#302a22" >仅限邀请</text><text x="570" y="303" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >仅持有效邀请的设备加入。</text><a href="28-private-confirm.svg" aria-label="仅限邀请"><rect x="555" y="216" width="262" height="115" fill="transparent"/></a><rect x="835" y="216" width="262" height="115" rx="6" fill="#fffaef" stroke="#e6dac4" /><g transform="translate(850 236) scale(0.96875)" fill="none" stroke="#302a22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20l10-9M13 8l2-2a7 7 0 0110 10l-3 3M20 24l-3 3A7 7 0 017 17l3-3"/></g><text x="895" y="260" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#302a22" >下线</text><text x="850" y="303" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >停止服务，保留订阅关系。</text><a href="30-offline-confirm.svg" aria-label="下线"><rect x="835" y="216" width="262" height="115" fill="transparent"/></a><rect x="275" y="347" width="822" height="48" rx="5" fill="#f5ead4" stroke="none" /><circle cx="296" cy="371" r="8" fill="#8a7c67" stroke="none"/><text x="296" y="375" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" >i</text><text x="316" y="376" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#302a22" >公开改为仅限邀请会踢出当前接收端，必须重新获邀。</text><rect x="275" y="407" width="822" height="48" rx="5" fill="#f5ead4" stroke="none" /><circle cx="296" cy="431" r="8" fill="#8a7c67" stroke="none"/><text x="296" y="435" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" >i</text><text x="316" y="436" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#302a22" >设为下线会停止当前串流，但不会删除已有订阅。</text><text x="275" y="500" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#302a22" >邀请管理</text><rect x="905" y="475" width="192" height="36" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="1001" y="498" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#302a22" >＋ 生成新邀请</text><a href="09-access.svg" aria-label="＋ 生成新邀请"><rect x="905" y="475" width="192" height="36" fill="transparent"/></a><rect x="275" y="520" width="822" height="159" rx="6" fill="#fffdf4" stroke="#e6dac4" /><text x="293" y="553" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#302a22" >邀请链接</text><rect x="396" y="533" width="528" height="33" rx="5" fill="#fff7e7" stroke="#e6dac4" /><text x="408" y="555" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >https://本站/invite/Ab3Xy9Zq（示例）</text><rect x="937" y="533" width="142" height="33" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="1008" y="554.5" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#302a22" >复制链接</text><text x="293" y="601" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#302a22" >邀请码</text><rect x="396" y="580" width="528" height="33" rx="5" fill="#fff7e7" stroke="#e6dac4" /><text x="408" y="602" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#302a22" >7F4K - 2D9P - Q8HJ</text><rect x="937" y="580" width="142" height="33" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="1008" y="601.5" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#302a22" >复制代码</text><text x="293" y="648" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#302a22" >链接设置</text><text x="396" y="648" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >24 小时有效 · 可手动撤销</text><rect x="937" y="629" width="142" height="32" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="1008" y="650" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#302a22" >撤销此邀请</text><text x="275" y="724" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#302a22" >已授权设备 / 订阅者</text><rect x="925" y="700" width="172" height="36" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="1011" y="723" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#a7473f" >踢出全部订阅者</text><a href="28-private-confirm.svg" aria-label="踢出全部订阅者"><rect x="925" y="700" width="172" height="36" fill="transparent"/></a><rect x="275" y="747" width="822" height="178" rx="6" fill="#fffdf4" stroke="#e6dac4" /><text x="295" y="778" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >设备名称</text><text x="606" y="778" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >订阅时间</text><text x="862" y="778" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >状态</text><text x="295" y="812" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#302a22" >我的手机</text><text x="606" y="812" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >今天 14:32</text><text x="862" y="812" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >在线</text><rect x="1005" y="791" width="74" height="29" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="1042" y="810.5" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#302a22" >踢出</text><a href="28-private-confirm.svg" aria-label="踢出"><rect x="1005" y="791" width="74" height="29" fill="transparent"/></a><text x="295" y="851" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#302a22" >客厅平板</text><text x="606" y="851" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >今天 12:26</text><text x="862" y="851" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >在线</text><rect x="1005" y="830" width="74" height="29" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="1042" y="849.5" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#302a22" >踢出</text><a href="28-private-confirm.svg" aria-label="踢出"><rect x="1005" y="830" width="74" height="29" fill="transparent"/></a><text x="295" y="890" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#302a22" >工作电脑</text><text x="606" y="890" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >昨天 19:45</text><text x="862" y="890" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >重连中</text><rect x="1005" y="869" width="74" height="29" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="1042" y="888.5" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#302a22" >踢出</text><a href="28-private-confirm.svg" aria-label="踢出"><rect x="1005" y="869" width="74" height="29" fill="transparent"/></a><rect x="1160" y="80" width="408" height="845" rx="6" fill="#fffdf4" stroke="#e6dac4" /><text x="1178" y="110" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#302a22" >可见性状态说明</text><rect x="1177" y="139" width="373" height="156" rx="5" fill="#f5ead4" stroke="none" /><text x="1194" y="172" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#302a22" >公开</text><text x="1194" y="204" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >出现在可见设备的发现列表。</text><text x="1194" y="228" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >只允许符合设备关系的接收端加入。</text><text x="1363" y="318" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#8a7c67" >↓ 状态切换</text><rect x="1177" y="328" width="373" height="156" rx="5" fill="#f5ead4" stroke="none" /><text x="1194" y="361" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#302a22" >仅限邀请</text><text x="1194" y="393" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >普通发现列表不展示。</text><text x="1194" y="417" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >持有效邀请或授权才可加入。</text><text x="1194" y="441" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >从公开切换时踢出旧接收端。</text><text x="1363" y="507" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#8a7c67" >↓ 状态切换</text><rect x="1177" y="517" width="373" height="156" rx="5" fill="#f5ead4" stroke="none" /><text x="1194" y="550" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#302a22" >下线</text><text x="1194" y="582" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >停止当前串流服务。</text><text x="1194" y="606" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >保留订阅关系及方阵位置。</text><text x="1194" y="630" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >上线后重新校验权限并恢复。</text><text x="1178" y="772" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >邀请被撤销与串流台下线分别处理。</text><text x="1178" y="799" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >收起界面不会自动停止或下线串流台。</text><text x="1178" y="826" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >重新上线保持配置，并检查现有授权。</text><rect x="0" y="0" width="1600" height="970" rx="0" fill="#30281d" stroke="none" opacity=".35"/><rect x="482" y="305" width="636" height="354" rx="6" fill="#fffdf4" stroke="#e6dac4" /><text x="510" y="356" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#302a22" >公开改为仅限邀请？</text><text x="510" y="410" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#8a7c67" >当前 3 台接收设备将被踢出，</text><text x="510" y="444" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#8a7c67" >需要重新取得有效邀请后才能加入。</text><text x="510" y="478" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#8a7c67" >台配置和播放列表会保留。</text><rect x="704" y="574" width="156" height="44" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="782" y="601" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#302a22" >取消</text><a href="09-access.svg" aria-label="取消"><rect x="704" y="574" width="156" height="44" fill="transparent"/></a><rect x="877" y="574" width="212" height="44" rx="5" fill="#a7473f" stroke="#a7473f" /><text x="983" y="601" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#fffdf7" >确认并踢出 3 台</text><a href="19-recovery.svg" aria-label="确认并踢出 3 台"><rect x="877" y="574" width="212" height="44" fill="transparent"/></a><rect x="0" y="970" width="1600" height="90" rx="8" fill="#fffdf8" stroke="none" /><line x1="0" y1="970" x2="1600" y2="970" stroke="#e6dac4" stroke-width="1" /><text x="30" y="1000" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#302a22" >28 / 公开转仅邀请 · 踢出确认</text><text x="30" y="1030" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >明确提醒当前接收端将被踢出并需重新获邀，确认前不应用可见性变更。</text><text x="1570" y="1000" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#51483a" >全屏浮层 · v3</text></svg>
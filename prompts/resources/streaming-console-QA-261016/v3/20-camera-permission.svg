<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><title>摄像头浏览器授权示意</title><defs><linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffbee"/><stop offset="1" stop-color="#fff5dc"/></linearGradient><linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#aea58e"/><stop offset="1" stop-color="#68614f"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#3e3525" flood-opacity=".16"/></filter></defs><rect x="0" y="0" width="1600" height="970" rx="0" fill="url(#warm)" stroke="none" /><text x="32" y="41" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#8a7c67" >← 返回  /  创建串流台  /  摄像头</text><a href="02-discovery.svg" aria-label="返回串流控制台"><rect x="28" y="15" width="205" height="37" fill="transparent"/></a><rect x="1389" y="18" width="179" height="36" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="1478.5" y="41" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#302a22" >← 返回首页</text><a href="22-home-background.svg" aria-label="← 返回首页"><rect x="1389" y="18" width="179" height="36" fill="transparent"/></a><text x="32" y="103" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#302a22" >配置摄像头串流台</text><text x="32" y="133" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#8a7c67" >实时采集为独立来源；保存配置后，由当前发起设备主动授权并开始。</text><rect x="32" y="158" width="185" height="36" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="124.5" y="181" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#302a22" >文件播放列表</text><a href="03-create-edit.svg" aria-label="文件播放列表"><rect x="32" y="158" width="185" height="36" fill="transparent"/></a><rect x="229" y="158" width="185" height="36" rx="5" fill="#51483a" stroke="#51483a" /><text x="321.5" y="181" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#fffdf7" >摄像头</text><a href="14-camera.svg" aria-label="摄像头"><rect x="229" y="158" width="185" height="36" fill="transparent"/></a><rect x="426" y="158" width="185" height="36" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="518.5" y="181" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#302a22" >屏幕共享</text><a href="15-screen.svg" aria-label="屏幕共享"><rect x="426" y="158" width="185" height="36" fill="transparent"/></a><rect x="32" y="221" width="977" height="585" rx="6" fill="#fffdf4" stroke="#e6dac4" /><text x="50" y="251" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#302a22" >采集预览</text><rect x="52" y="274" width="937" height="364" rx="4" fill="#e9dfcb" stroke="#e6dac4" /><g transform="translate(491 365) scale(1.875)" fill="none" stroke="#302a22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h7l2-5h8l2 5h6v18H4z"/><circle cx="17" cy="19" r="6"/></g><text x="520" y="473" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" font-weight="600" text-anchor="middle" fill="#8a7c67" >摄像头尚未启动</text><text x="520" y="512" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#8a7c67" >采集不会随打开页面或复用模板自动开始。</text><rect x="52" y="671" width="286" height="44" rx="5" fill="#51483a" stroke="#51483a" /><text x="195" y="698" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#fffdf7" >授权并开始采集</text><a href="20-camera-permission.svg" aria-label="授权并开始采集"><rect x="52" y="671" width="286" height="44" fill="transparent"/></a><rect x="353" y="671" width="213" height="44" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="459.5" y="698" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#302a22" >返回来源选择</text><a href="04-source-drive.svg" aria-label="返回来源选择"><rect x="353" y="671" width="213" height="44" fill="transparent"/></a><text x="52" y="754" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#8a7c67" >摄像头与麦克风分别授权，可选择不共享麦克风。</text><text x="52" y="779" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#8a7c67" >仅当前发起设备能开始采集，接收端不能代为开启。</text><rect x="1027" y="221" width="541" height="585" rx="6" fill="#fffdf4" stroke="#e6dac4" /><text x="1045" y="251" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#302a22" >台配置</text><text x="1047" y="292" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#8a7c67" >台号 / 名称</text><rect x="1047" y="302" width="501" height="37" rx="7" fill="#fff" stroke="#e6dac4" /><text x="1059" y="326" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#302a22" >02 · 书桌摄像头</text><text x="1047" y="383" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#8a7c67" >摄像头</text><rect x="1047" y="393" width="501" height="37" rx="7" fill="#fff" stroke="#e6dac4" /><text x="1059" y="417" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#302a22" >Integrated Camera ▾</text><text x="1047" y="474" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#8a7c67" >麦克风</text><rect x="1047" y="484" width="501" height="37" rx="7" fill="#fff" stroke="#e6dac4" /><text x="1059" y="508" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#302a22" >不共享麦克风 ▾</text><text x="1047" y="579" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#8a7c67" >可见性</text><circle cx="1056" cy="611" r="8" fill="#fffdf7" stroke="#8a7c67"/><text x="1075" y="616" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#302a22" >公开</text><circle cx="1197" cy="611" r="8" fill="#fffdf7" stroke="#302a22"/><circle cx="1197" cy="611" r="4" fill="#302a22" stroke="none"/><text x="1216" y="616" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#302a22" >仅限邀请</text><text x="1047" y="661" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >当前文件播放列表仍保留，可切换回来复用。</text><rect x="1047" y="728" width="501" height="44" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="1297.5" y="755" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#302a22" >只保存配置</text><a href="10-my-stations.svg" aria-label="只保存配置"><rect x="1047" y="728" width="501" height="44" fill="transparent"/></a><rect x="32" y="838" width="1536" height="48" rx="5" fill="#f5ead4" stroke="none" /><circle cx="53" cy="862" r="8" fill="#8a7c67" stroke="none"/><text x="53" y="866" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" >i</text><text x="73" y="867" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#302a22" >实时来源使用 LIVE 状态，不显示文件进度条、拖动、快进或快退；接收端可暂停本机观看。</text><rect x="0" y="0" width="1600" height="970" rx="0" fill="#30281d" stroke="none" opacity=".36"/><rect x="482" y="195" width="636" height="568" rx="6" fill="#fffdf4" stroke="#e6dac4" /><text x="500" y="225" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#302a22" >浏览器权限提示示意</text><text x="506" y="270" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#302a22" >允许本站使用摄像头？</text><text x="506" y="305" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#8a7c67" >以下是浏览器原生界面的示意，具体样式随设备变化。</text><g transform="translate(759 350) scale(2.1875)" fill="none" stroke="#302a22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h7l2-5h8l2 5h6v18H4z"/><circle cx="17" cy="19" r="6"/></g><text x="506" y="486" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#302a22" >摄像头：Integrated Camera</text><text x="506" y="531" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#8a7c67" >麦克风：本次未申请</text><text x="506" y="583" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#8a7c67" >只有点击允许后才会开始采集。</text><text x="506" y="612" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#8a7c67" >拒绝后保留配置，可稍后重新授权。</text><rect x="760" y="696" width="153" height="42" rx="5" fill="#fffaf0" stroke="#e6dac4" /><text x="836.5" y="722" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#302a22" >不允许</text><a href="14-camera.svg" aria-label="不允许"><rect x="760" y="696" width="153" height="42" fill="transparent"/></a><rect x="928" y="696" width="165" height="42" rx="5" fill="#51483a" stroke="#51483a" /><text x="1010.5" y="722" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#fffdf7" >允许</text><a href="32-live-active.svg" aria-label="允许"><rect x="928" y="696" width="165" height="42" fill="transparent"/></a><rect x="0" y="970" width="1600" height="90" rx="8" fill="#fffdf8" stroke="none" /><line x1="0" y1="970" x2="1600" y2="970" stroke="#e6dac4" stroke-width="1" /><text x="30" y="1000" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#302a22" >20 / 摄像头浏览器授权示意</text><text x="30" y="1030" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#8a7c67" >原生权限由当前发起设备确认；允许后进入实时采集态，拒绝后保留配置。</text><text x="1570" y="1000" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#51483a" >全屏浮层 · v3</text></svg>
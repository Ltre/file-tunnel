function sizePhone(){const [w,h]=size.value.split(',').map(Number),phone=document.getElementById('phone'),wrap=document.getElementById('mobile-stage');frame.style.width=w+'px';frame.style.height=h+'px';phone.style.width=(w+8)+'px';const available=wrap.clientWidth-14,scale=Math.min(1,available/(w+8));phone.style.transform='scale('+scale+')';wrap.style.height=Math.ceil((h+8)*scale+30)+'px';phone.style.marginBottom=-(h+8)*(1-scale)+'px';}
function downloads(s){const root=document.getElementById('downloads');root.replaceChildren();const links=mode==='desktop'?[['SVG',s.id+'.svg'],['PNG',s.id+'.png']]:[['单页长图','mobile/previews/'+s.id+'.png'],['移动页面','mobile/index.html#'+s.id],['移动版说明','mobile/README.md']];links.forEach(([label,url])=>{const a=document.createElement('a');a.href=url;a.target='_blank';a.textContent=' · '+label;root.append(a);});}
function render(){const isMobile=mode==='mobile';document.getElementById('desktop-mode').setAttribute('aria-pressed',String(!isMobile));document.getElementById('mobile-mode').setAttribute('aria-pressed',String(isMobile));stage.hidden=isMobile;document.getElementById('mobile-stage').hidden=!isMobile;size.hidden=!isMobile;document.getElementById('notice').hidden=!isMobile;document.getElementById('overview').href=isMobile?'mobile/00-overview.png':'00-overview.png';const pages=allPages(),requested=isMobile?mapped(currentId()):currentId();current=pages.findIndex(s=>s.id===requested);if(current<0)current=pages.findIndex(s=>s.id==='02-discovery');const s=pages[current];selector.value=s.id;document.getElementById('note').textContent=s.note||s.title;downloads(s);nav.querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.id===s.id));if(!isMobile){stage.innerHTML=s.svg;stage.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{const to=(a.getAttribute('href')||'').replace(/\.svg$/,'');if(screens.some(x=>x.id===to)){e.preventDefault();location.hash=to;}}));}else{if(!frameReady){frame.src='mobile/index.html?embedded=1#'+s.id;lastMobile=s.id;}else if(!bridge&&lastMobile!==s.id){frame.contentWindow.postMessage({type:'stream-v3-review-go',id:s.id},'*');lastMobile=s.id;}sizePhone();}bridge=false;}
function setMode(next){const id=currentId();mode=next;buildNav();const target=next==='mobile'?mapped(id):screens.some(s=>s.id===id)?id:(mobile.pages.find(s=>s.id===id)?.pcId||'02-discovery');const params=new URLSearchParams(location.search);if(next==='mobile')params.set('mode','mobile');else params.delete('mode');history.replaceState(null,'',location.pathname+(params.size?'?'+params.toString():'')+'#'+target);render();}
selector.onchange=()=>location.hash=selector.value;document.getElementById('desktop-mode').onclick=()=>setMode('desktop');document.getElementById('mobile-mode').onclick=()=>setMode('mobile');document.getElementById('prev').onclick=()=>location.hash=allPages()[(current+allPages().length-1)%allPages().length].id;document.getElementById('next').onclick=()=>location.hash=allPages()[(current+1)%allPages().length].id;size.onchange=sizePhone;window.addEventListener('resize',()=>{if(mode==='mobile')sizePhone();});frame.addEventListener('load',()=>{frameReady=true;if(mode==='mobile'){const target=mapped(currentId());frame.contentWindow.postMessage({type:'stream-v3-review-go',id:target},'*');lastMobile=target;}});window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data?.type!=='stream-v3-mobile-route'||!mobile.pages.some(p=>p.id===e.data.id))return;lastMobile=e.data.id;if(mode==='mobile'&&mapped(currentId())!==e.data.id){bridge=true;location.hash=e.data.id;}});window.addEventListener('hashchange',render);buildNav();render();
</script></body></html>

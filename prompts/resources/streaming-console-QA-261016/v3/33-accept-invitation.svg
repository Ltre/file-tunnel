vg" aria-label="拒绝 / 返回发现"><rect x="310" y="658" width="312" height="48" fill="transparent"/></a><rect x="642" y="658" width="647" height="48" rx="5" fill="#404040" stroke="#404040" /><text x="965.5" y="687" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff" >接受邀请并打开</text><a href="36-receiver-live.svg" aria-label="接受邀请并打开"><rect x="642" y="658" width="647" height="48" fill="transparent"/></a><rect x="276" y="798" width="1048" height="48" rx="5" fill="#f1f1f1" stroke="none" /><circle cx="297" cy="822" r="8" fill="#737373" stroke="none"/><text x="297" y="826" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" >i</text><text x="317" y="827" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#262626" >可输入邀请链接或邀请码；失效、被撤销或不属于本设备的邀请应单独提示。</text><rect x="0" y="970" width="1600" height="90" rx="8" fill="#ffffff" stroke="none" /><line x1="0" y1="970" x2="1600" y2="970" stroke="#dedede" stroke-width="1" /><text x="30" y="1000" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#262626" >33 / 接收邀请 · 校验与加入</text><text x="30" y="1030" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#737373" >只展示当前设备实际获得的有效邀请，接受后订阅；失效或被撤销的邀请不能继续加入。</text><text x="1570" y="1000" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#404040" >全屏浮层 · v3</text><text x="276" y="880" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#737373" >邀请链接或邀请码</text><rect x="276" y="890" width="748" height="37" rx="7" fill="#fff" stroke="#dedede" /><text x="288" y="914" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#262
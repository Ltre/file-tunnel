<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><title>异常、下线与权限恢复</title><defs><linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a8a8a8"/><stop offset="1" stop-color="#666666"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity=".16"/></filter></defs><rect x="0" y="0" width="1600" height="970" rx="0" fill="url(#warm)" stroke="none" /><text x="32" y="41" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#737373" >← 返回  /  串流控制台  /  状态与恢复</text><a href="02-discovery.svg" aria-label="返回串流控制台"><rect x="28" y="15" width="205" height="37" fill="transparent"/></a><rect x="1389" y="18" width="179" height="36" rx="5" fill="#ffffff" stroke="#dedede" /><text x="1478.5" y="41" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#262626" >← 返回首页</text><a href="22-home-background.svg" aria-label="← 返回首页"><rect x="1389" y="18" width="179" height="36" fill="transparent"/></a><text x="32" y="103" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#262626" >状态与恢复</text><text x="32" y="133" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#737373" >以下为四个独立台的异常状态示例，不是同一台同时处于四种状态。</text><rect x="32" y="180" width="759" height="327" rx="6" fill="#ffffff" stroke="#dedede" /><rect x="53" y="199" width="51" height="25" rx="4" fill="#f1f1f1" stroke="none" /><text x="78.5" y="217" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#737373" >01</text><text x="119" y="222" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#262626" >提供设备已下线</text><text x="54" y="271" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#737373" >家庭相册 · NAS</text><line x1="54" y1="296" x2="769" y2="296" stroke="#dedede" stroke-width="1" /><text x="54" y="337" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#737373" >订阅和方阵位置保留。</text><text x="54" y="368" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#737373" >重新上线并重新校验权限后可继续观看。</text><rect x="54" y="426" width="275" height="43" rx="5" fill="#404040" stroke="#404040" /><text x="191.5" y="452.5" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff" >返回订阅列表</text><a href="11-my-subscriptions.svg" aria-label="返回订阅列表"><rect x="54" y="426" width="275" height="43" fill="transparent"/></a><rect x="809" y="180" width="759" height="327" rx="6" fill="#ffffff" stroke="#dedede" /><rect x="830" y="199" width="51" height="25" rx="4" fill="#f1f1f1" stroke="none" /><text x="855.5" y="217" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#737373" >02</text><text x="896" y="222" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#262626" >连接暂时中断</text><text x="831" y="271" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#737373" >客厅电视 · 重连中</text><line x1="831" y1="296" x2="1546" y2="296" stroke="#dedede" stroke-width="1" /><text x="831" y="337" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#737373" >保留当前台、共享目标进度与来源信息。</text><text x="831" y="368" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#737373" >恢复连接后追随当前台状态，避免按旧进度播放。</text><rect x="831" y="426" width="275" height="43" rx="5" fill="#404040" stroke="#404040" /><text x="968.5" y="452.5" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff" >重新连接</text><a href="07-receiver.svg" aria-label="重新连接"><rect x="831" y="426" width="275" height="43" fill="transparent"/></a><rect x="32" y="537" width="759" height="327" rx="6" fill="#ffffff" stroke="#dedede" /><rect x="53" y="556" width="51" height="25" rx="4" fill="#f1f1f1" stroke="none" /><text x="78.5" y="574" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#737373" >03</text><text x="119" y="579" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#262626" >本机文件需要重新选择</text><text x="54" y="628" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#737373" >电影之夜 · 本机来源</text><line x1="54" y1="653" x2="769" y2="653" stroke="#dedede" stroke-width="1" /><text x="54" y="694" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#737373" >保存配置不等于持久保存浏览器文件授权。</text><text x="54" y="725" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#737373" >换设备或权限失效时，需在发起设备重新选择文件。</text><rect x="54" y="783" width="275" height="43" rx="5" fill="#404040" stroke="#404040" /><text x="191.5" y="809.5" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff" >重新选择来源</text><a href="12-source-local.svg" aria-label="重新选择来源"><rect x="54" y="783" width="275" height="43" fill="transparent"/></a><rect x="809" y="537" width="759" height="327" rx="6" fill="#ffffff" stroke="#dedede" /><rect x="830" y="556" width="51" height="25" rx="4" fill="#f1f1f1" stroke="none" /><text x="855.5" y="574" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#737373" >04</text><text x="896" y="579" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#262626" >浏览器阻止自动播放</text><text x="831" y="628" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#737373" >音乐台 · 已连接</text><line x1="831" y1="653" x2="1546" y2="653" stroke="#dedede" stroke-width="1" /><text x="831" y="694" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#737373" >收到台状态，但本机尚未获得播放许可。</text><text x="831" y="725" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#737373" >用户点按后开始本机观看，不更改全台播放状态。</text><rect x="831" y="783" width="275" height="43" rx="5" fill="#404040" stroke="#404040" /><text x="968.5" y="809.5" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff" >点按开始观看</text><a href="07-receiver.svg" aria-label="点按开始观看"><rect x="831" y="783" width="275" height="43" fill="transparent"/></a><rect x="32" y="914" width="1536" height="48" rx="5" fill="#f1f1f1" stroke="none" /><circle cx="53" cy="938" r="8" fill="#737373" stroke="none"/><text x="53" y="942" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" >i</text><text x="73" y="943" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#262626" >邀请被撤销时应立即停止接收并要求重新获邀；网络断开、下线与权限失效分别提示。</text><rect x="0" y="970" width="1600" height="90" rx="8" fill="#ffffff" stroke="none" /><line x1="0" y1="970" x2="1600" y2="970" stroke="#dedede" stroke-width="1" /><text x="30" y="1000" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#262626" >19 / 异常、下线与权限恢复</text><text x="30" y="1030" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#737373" >四个互相独立的台状态：下线、重连、本机文件授权失效、自动播放受限。</text><text x="1570" y="1000" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#404040" >全屏浮层 · v3</text></svg>
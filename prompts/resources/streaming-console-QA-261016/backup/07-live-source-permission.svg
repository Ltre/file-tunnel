<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><title>实时串流源的本机权限与屏幕共享选择</title><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#586ce4"/><stop offset="1" stop-color="#3448bc"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#22304d" flood-opacity=".22"/></filter></defs><rect x="0" y="0" width="1440" height="960" rx="0" fill="#f3f5fa" stroke="none"/><rect x="0" y="0" width="1440" height="54" rx="0" fill="#ffffff" stroke="#d6dce9" stroke-width="1"/><rect x="40" y="8" width="38" height="38" rx="6" fill="#ffffff" stroke="#e3e7ef" stroke-width="1"/><text x="59" y="34" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="21" font-weight="500" text-anchor="middle" fill="#52617e">↻</text><rect x="86" y="8" width="38" height="38" rx="6" fill="#ffffff" stroke="#e3e7ef" stroke-width="1"/><text x="105" y="33" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#52617e">⇩</text><rect x="132" y="8" width="38" height="38" rx="6" fill="#ffffff" stroke="#e3e7ef" stroke-width="1"/><text x="151" y="33" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#52617e">◐</text><rect x="178" y="8" width="38" height="38" rx="6" fill="#ffffff" stroke="#e3e7ef" stroke-width="1"/><text x="197" y="33" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#52617e">⚙</text><rect x="1362" y="8" width="38" height="38" rx="6" fill="#ffffff" stroke="#e3e7ef" stroke-width="1"/><ellipse cx="1381" cy="27" rx="9.5" ry="6" fill="none" stroke="#52617e" stroke-width="1.5"/><circle cx="1381" cy="27" r="2.4" fill="#52617e"/><line x1="1372" y1="36" x2="1390" y2="18" stroke="#52617e" stroke-width="1.7" stroke-linecap="round"/><rect x="24" y="94" width="218" height="832" rx="14" fill="#fff" stroke="#e4e9f2"/><text x="46" y="128" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="16" font-weight="750" text-anchor="start" fill="#202a3b">串流控制台</text><text x="56" y="215" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#465bd5">我创建的</text><text x="56" y="270" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#465bd5">实时源采集</text><text x="56" y="324" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#202a3b">自动发现</text><text x="56" y="378" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#202a3b">监控大爷模式</text><rect x="40" y="830" width="186" height="75" rx="10" fill="#f7f8fc" stroke="none"/><text x="60" y="856" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="12" font-weight="650" text-anchor="start" fill="#202a3b">本机：Dell PC</text><text x="60" y="878" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="10" font-weight="450" text-anchor="start" fill="#758198">采集只能由本机确认</text><text x="272" y="122" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="24" font-weight="750" text-anchor="start" fill="#202a3b">实时源采集</text><text x="272" y="148" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#758198">摄像头与屏幕共享需要发起设备主动启动并授予浏览器权限。</text><rect x="260" y="177" width="1138" height="646" rx="13" fill="#fff" stroke="#e4e9f2"/><text x="286" y="213" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#202a3b">03 · 书房屏幕</text><text x="286" y="238" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="11" font-weight="450" text-anchor="start" fill="#758198">当前来源：屏幕 / 窗口 / 浏览器标签页</text><rect x="286" y="262" width="462" height="286" rx="12" fill="#18223a" stroke="none"/><text x="517" y="379" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="16" font-weight="650" text-anchor="middle" fill="#dce5ff">等待选择共享画面</text><text x="517" y="407" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="11" font-weight="450" text-anchor="middle" fill="#b6c4e0">允许后，本机预览会出现在这里</text><rect x="770" y="262" width="602" height="286" rx="12" fill="#f8f9fc" stroke="#e4e9f2"/><text x="796" y="294" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#202a3b">开启前确认</text><rect x="796" y="312" width="550" height="51" rx="9" fill="#eef8f3" stroke="#d5eee1"/><text x="815" y="334" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="14" font-weight="750" text-anchor="start" fill="#16966a">✓</text><text x="840" y="335" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#202a3b">只在发起设备本机弹出权限与屏幕选择窗口</text><text x="840" y="353" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="10" font-weight="450" text-anchor="start" fill="#758198">远端接收端不能强行打开你的摄像头或屏幕。</text><rect x="796" y="376" width="550" height="51" rx="9" fill="#fff6e5" stroke="#f1e2c3"/><text x="815" y="398" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="14" font-weight="750" text-anchor="start" fill="#b7791f">!</text><text x="840" y="399" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#202a3b">系统音频由浏览器与操作系统决定</text><text x="840" y="417" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="10" font-weight="450" text-anchor="start" fill="#758198">如果未提供音轨，仍可只共享画面。</text><text x="796" y="456" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#758198">来源控制</text><rect x="796" y="472" width="156" height="38" rx="8" fill="#465bd5" stroke="#465bd5"/><text x="874" y="496" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="12" font-weight="650" text-anchor="middle" fill="#fff">选择屏幕或窗口</text><rect x="962" y="472" width="132" height="38" rx="8" fill="#fff" stroke="#e4e9f2"/><text x="1028" y="496" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="12" font-weight="650" text-anchor="middle" fill="#202a3b">选择摄像头</text><text x="1112" y="495" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#b7791f">采集状态：尚未开始</text><rect x="286" y="574" width="1086" height="88" rx="10" fill="#f7f8fc" stroke="#e4e9f2"/><text x="310" y="602" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="12" font-weight="650" text-anchor="start" fill="#202a3b">摄像头来源</text><text x="310" y="626" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#758198">选择设备并在本机授权；配置可保存，采集不会自动恢复。</text><rect x="877" y="588" width="205" height="38" rx="8" fill="#fff" stroke="#e4e9f2"/><text x="895" y="612" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start" fill="#202a3b">Integrated Camera</text><text x="1065" y="612" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#758198">⌄</text><rect x="1098" y="588" width="119" height="38" rx="8" fill="#fff" stroke="#e4e9f2"/><text x="1157.5" y="612" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="12" font-weight="650" text-anchor="middle" fill="#202a3b">开始摄像头</text><rect x="1227" y="588" width="119" height="38" rx="8" fill="#fff" stroke="#e4e9f2"/><text x="1286.5" y="612" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="12" font-weight="650" text-anchor="middle" fill="#202a3b">停止采集</text><rect x="286" y="684" width="1086" height="94" rx="10" fill="#eef0ff" stroke="#dfe3ff"/><text x="310" y="714" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#465bd5">移动设备提示</text><text x="310" y="739" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#202a3b">屏幕共享通常需要用户前台操作；手机切到后台、锁屏或省电时，浏览器可能暂停采集或传输。</text><text x="310" y="760" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#758198">多个串流台复用同一摄像头时，应避免重复争抢设备。</text><rect x="0" y="0" width="1440" height="960" fill="#111827" opacity=".24"/><rect x="398" y="166" width="644" height="591" rx="13" fill="#fff" stroke="#d8deea"/><text x="432" y="202" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#202a3b">选择要分享的内容</text><text x="1007" y="201" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#758198">×</text><line x1="398" y1="220" x2="1042" y2="220" stroke="#e4e9f2" stroke-width="1"/><text x="432" y="253" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start" fill="#758198">选择屏幕共享来源</text><rect x="430" y="270" width="185" height="38" rx="8" fill="#eef0ff" stroke="#465bd5"/><text x="522" y="294" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="12" font-weight="650" text-anchor="middle" fill="#465bd5">整个屏幕</text><rect x="625" y="270" width="185" height="38" rx="8" fill="#f7f8fc" stroke="#e4e9f2"/><text x="717" y="294" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="12" font-weight="550" text-anchor="middle" fill="#758198">应用窗口</text><rect x="820" y="270" width="188" height="38" rx="8" fill="#f7f8fc" stroke="#e4e9f2"/><text x="914" y="294" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="12" font-weight="550" text-anchor="middle" fill="#758198">浏览器标签页</text><rect x="430" y="324" width="287" height="215" rx="9" fill="#e8edf4" stroke="#cfd7e5"/><rect x="444" y="338" width="259" height="161" rx="6" fill="url(#brand)" stroke="none"/><rect x="456" y="350" width="235" height="17" rx="4" fill="#ffffff" stroke="none"/><text x="573" y="362" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#758198">屏幕 1</text><text x="573" y="523" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#202a3b">屏幕 1</text><rect x="738" y="324" width="270" height="215" rx="9" fill="#f7f8fc" stroke="#e4e9f2"/><rect x="752" y="338" width="242" height="161" rx="6" fill="#e8f0f7" stroke="none"/><path d="M752 476 L824 414 L880 472 L930 420 L994 480 V499 H752Z" fill="#91a795"/><text x="873" y="523" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#202a3b">工作窗口</text><rect x="430" y="561" width="14" height="14" rx="4" fill="#465bd5" stroke="#465bd5"/><text x="452" y="573" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="11" font-weight="500" text-anchor="start" fill="#202a3b">共享系统音频（如果浏览器提供）</text><line x1="398" y1="607" x2="1042" y2="607" stroke="#e4e9f2" stroke-width="1"/><text x="432" y="639" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="10" font-weight="450" text-anchor="start" fill="#758198">只有发起设备可以选择共享目标。</text><rect x="810" y="681" width="94" height="38" rx="8" fill="#fff" stroke="#e4e9f2"/><text x="857" y="705" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="12" font-weight="650" text-anchor="middle" fill="#202a3b">取消</text><rect x="914" y="681" width="94" height="38" rx="8" fill="#465bd5" stroke="#465bd5"/><text x="961" y="705" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="12" font-weight="650" text-anchor="middle" fill="#fff">分享</text><text x="720" y="727" font-family="Microsoft YaHei, Noto Sans SC, Segoe UI, sans-serif" font-size="9" font-weight="450" text-anchor="middle" fill="#9aa4b6">浏览器原生选择器示意</text></svg>
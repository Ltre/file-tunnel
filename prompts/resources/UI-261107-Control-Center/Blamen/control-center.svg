<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Blamen 宽屏控制中心原型</title>
  <desc id="desc">左栏展示传输进度和未读消息；右栏展示可排序的功能磁贴与纵向隧道列表。两栏等宽，关闭按钮位于控制中心全局右上角。</desc>
  <defs>
    <pattern id="theme-stripes" width="220" height="220" patternUnits="userSpaceOnUse" patternTransform="rotate(36)"><rect width="220" height="220" fill="#f1f1f1"/><path d="M0 0h70v220H0z" fill="#e8e8e8"/><path d="M70 0h72v220H70z" fill="#ededed"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#728bb4" flood-opacity=".18"/></filter>
    <filter id="bgblur"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="bar"><stop stop-color="#667eea"/><stop offset="1" stop-color="#764ba2"/></linearGradient>
    <style>
      text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#151b3e} .muted{fill:#7884a3} .tiny{font-size:13px} .small{font-size:14px} .label{font-size:16px;font-weight:600} .subtle{fill:#edf4fc;stroke:#dce8f4} .tile{fill:#edf4fc;stroke:#dce8f4} .tileIcon{font-size:24px;text-anchor:middle;dominant-baseline:central} .file{font-size:14px;font-weight:600} .tunnelName{font-size:14px;font-weight:600;text-anchor:middle} .time{font-size:11px;fill:#7884a3;text-anchor:middle}
    </style>
  </defs>
  <!-- Current three-pane home is background context, not part of the proposed changes. -->
  <rect width="1600" height="1000" fill="url(#theme-stripes)"/>
  <g filter="url(#bgblur)" opacity=".75">
    <rect x="0" y="0" width="1600" height="60" fill="#e1e5f2"/>
    <g fill="#f7fbff" stroke="#dce8f4"><rect x="54" y="76" width="350" height="900" rx="12"/><rect x="420" y="76" width="710" height="900" rx="12"/><rect x="1146" y="76" width="400" height="900" rx="12"/></g>
    <g fill="#d5d9e6"><rect x="54" y="76" width="350" height="45" rx="10"/><rect x="420" y="76" width="710" height="45" rx="10"/><rect x="1146" y="76" width="400" height="45" rx="10"/></g>
    <g fill="#7884a3" font-size="17" font-weight="600"><text x="78" y="105">连接设备</text><text x="445" y="105">传输记录</text><text x="1170" y="105">协同编辑</text></g>
    <rect x="150" y="180" width="160" height="160" rx="12" fill="#dce8f4"/><rect x="470" y="190" width="440" height="90" rx="12" fill="#edf4fc"/><rect x="600" y="320" width="430" height="180" rx="12" fill="#e5f0ff"/><rect x="1180" y="175" width="330" height="580" rx="12" fill="#f1f1f1"/>
  </g>
  <rect width="1600" height="1000" fill="#1b2548" opacity=".35"/>
  <!-- 460px + 460px columns: 400px narrow control center × 1.15. -->
  <g filter="url(#shadow)"><rect x="298" y="85" width="1004" height="830" rx="20" fill="#f7fbff"/></g>
  <text x="326" y="125" font-size="20" font-weight="700">控制中心</text>
  <rect x="1244" y="101" width="38" height="38" rx="12" fill="#edf4fc" stroke="#dce8f4"/>
  <text x="1263" y="126" text-anchor="middle" font-size="23" fill="#7884a3">×</text>
  <path d="M318 151H1282" stroke="#dce8f4"/>
  <!-- Left column -->
  <rect x="318" y="170" width="460" height="296" rx="14" fill="#f7fbff" stroke="#dce8f4"/>
  <text x="338" y="198" class="label">传输进度</text>
  <text x="338" y="219" class="tiny muted">7 个任务 · 进行中 3 · 1 个停滞</text>
  <text x="338" y="237" class="tiny muted">2 个准备传输 · 1 个等待</text>
  <path d="M338 245H758" stroke="#dce8f4"/>
  <!-- Four of seven actual task rows; the unobtrusive thumb indicates more rows below. -->
  <g><text x="340" y="269" font-size="13" style="fill:#d63d3d">▲</text><text x="358" y="269" class="file">设计素材.zip</text><text x="756" y="269" text-anchor="end" class="small muted">72% · P2P</text><rect x="340" y="278" width="416" height="8" rx="4" fill="#dce8f4"/><rect x="340" y="278" width="300" height="8" rx="4" fill="url(#bar)"/></g>
  <g><text x="340" y="319" font-size="13" style="fill:#159a55">▼</text><text x="358" y="319" class="file">周末影像.mp4</text><text x="756" y="319" text-anchor="end" class="small muted">48% · Socket.IO relay</text><rect x="340" y="328" width="416" height="8" rx="4" fill="#dce8f4"/><rect x="340" y="328" width="200" height="8" rx="4" fill="url(#bar)"/></g>
  <g><text x="340" y="369" font-size="13" style="fill:#d63d3d">▲</text><text x="358" y="369" class="file">项目文档.pdf</text><text x="756" y="369" text-anchor="end" class="small muted">31% · multi-source P2P</text><rect x="340" y="378" width="416" height="8" rx="4" fill="#dce8f4"/><rect x="340" y="378" width="129" height="8" rx="4" fill="url(#bar)"/></g>
  <g><text x="340" y="419" font-size="13" style="fill:#159a55">▼</text><text x="358" y="419" class="file">照片合集.zip</text><text x="756" y="419" text-anchor="end" class="small muted">26% · P2P</text><rect x="340" y="428" width="416" height="8" rx="4" fill="#dce8f4"/><rect x="340" y="428" width="108" height="8" rx="4" fill="url(#bar)"/></g>
  <rect x="765" y="253" width="4" height="184" rx="2" fill="#dce8f4" opacity=".55"/><rect x="765" y="253" width="4" height="105" rx="2" fill="#7884a3" opacity=".48"/>
  <rect x="318" y="482" width="460" height="409" rx="14" fill="#f7fbff" stroke="#dce8f4"/>
  <text x="338" y="514" class="label">未读消息</text><rect x="410" y="496" width="24" height="22" rx="11" fill="#e5f0ff"/><text x="422" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#3c29cf">3</text>
  <text x="758" y="513" text-anchor="end" font-size="13" fill="#3c29cf">打开通知中心 ›</text>
  <path d="M338 528H758" stroke="#e4edf6"/>
  <g><rect x="338" y="544" width="420" height="94" rx="12" fill="#f5f9ff" stroke="#dce8f4"/><circle cx="353" cy="563" r="4" fill="#3c29cf"/><text x="366" y="568" class="small" font-weight="700">串流邀请</text><text x="742" y="568" text-anchor="end" class="tiny muted">10:36</text><text x="366" y="594" class="small muted">小陈邀请你观看串流台「周末放映」</text><text x="366" y="618" font-size="12" fill="#3c29cf">接受邀请　　拒绝　　查看邀请</text></g>
  <g><rect x="338" y="648" width="420" height="94" rx="12" fill="#f5f9ff" stroke="#dce8f4"/><circle cx="353" cy="667" r="4" fill="#3c29cf"/><text x="366" y="672" class="small" font-weight="700">网页 ZIP 编辑权限申请</text><text x="742" y="672" text-anchor="end" class="tiny muted">10:21</text><text x="366" y="698" class="small muted">设备 iPad 申请编辑「设计方案.zip」</text><text x="366" y="722" font-size="12" fill="#3c29cf">允许编辑　　拒绝</text></g>
  <g><rect x="338" y="752" width="420" height="74" rx="12" fill="#f5f9ff" stroke="#dce8f4"/><circle cx="353" cy="771" r="4" fill="#3c29cf"/><text x="366" y="776" class="small" font-weight="700">网页编辑权限已获批准</text><text x="742" y="776" text-anchor="end" class="tiny muted">09:58</text><text x="366" y="802" class="small muted">「主页方案.zip」的编辑申请已通过</text></g>
  <!-- Right column: preserve the existing vertical tunnel list and default tile set. -->
  <rect x="802" y="170" width="460" height="721" rx="14" fill="#f7fbff" stroke="#dce8f4"/>
  <g transform="translate(873 190)">
    <g class="tile"><rect x="0" y="0" width="54" height="48" rx="12"/><rect x="66" y="0" width="54" height="48" rx="12"/><rect x="132" y="0" width="54" height="48" rx="12"/><rect x="198" y="0" width="54" height="48" rx="12"/><rect x="264" y="0" width="54" height="48" rx="12"/>
      <rect x="0" y="60" width="54" height="48" rx="12"/><rect x="66" y="60" width="54" height="48" rx="12"/><rect x="132" y="60" width="54" height="48" rx="12"/><rect x="198" y="60" width="54" height="48" rx="12"/><rect x="264" y="60" width="54" height="48" rx="12"/>
      <rect x="66" y="120" width="54" height="48" rx="12"/><rect x="132" y="120" width="54" height="48" rx="12"/><rect x="198" y="120" width="54" height="48" rx="12"/></g>
    <g class="tileIcon"><text x="27" y="24">↻</text><text x="93" y="24">🧲</text><text x="159" y="24">◐</text><text x="225" y="24">⚙</text><text x="291" y="24">◉</text><text x="27" y="84">▩</text><text x="93" y="84">✴</text><text x="159" y="84">▤</text><text x="225" y="84">🌐</text><text x="291" y="84">🔔</text><text x="93" y="144">▥</text><text x="159" y="144">♪</text><text x="225" y="144">◉</text></g>
  </g>
  <path d="M822 380H1242" stroke="#e4edf6"/>
  <text x="1032" y="415" text-anchor="middle" font-size="17" font-weight="700">切换隧道</text>
  <rect x="824" y="431" width="416" height="27" rx="13.5" fill="#eaf2ff"/><text x="1032" y="449" text-anchor="middle" font-size="14" fill="#3c29cf">⌃</text>
  <g><rect x="824" y="470" width="416" height="56" rx="11" fill="#e5f0ff" stroke="#aab6db"/><text x="1032" y="492" class="tunnelName">K7M2P · 灵感工作室</text><text x="1032" y="510" class="time">2026/11/07 10:24:16</text></g>
  <g><rect x="824" y="534" width="416" height="56" rx="11" class="subtle"/><text x="1032" y="556" class="tunnelName">N8Q4T · 周末放映室</text><text x="1032" y="574" class="time">2026/11/06 21:07:11</text></g>
  <g><rect x="824" y="598" width="416" height="56" rx="11" class="subtle"/><text x="1032" y="620" class="tunnelName">A3B8K · 设计资料</text><text x="1032" y="638" class="time">2026/11/05 20:00:00</text></g>
  <g><rect x="824" y="662" width="416" height="56" rx="11" class="subtle"/><text x="1032" y="684" class="tunnelName">D9J4N · 家庭分享</text><text x="1032" y="702" class="time">2026/11/04 19:00:00</text></g>
  <g><rect x="824" y="726" width="416" height="56" rx="11" class="subtle"/><text x="1032" y="748" class="tunnelName">F7M2R · 工作备忘</text><text x="1032" y="766" class="time">2026/11/03 18:00:00</text></g>
  <g><rect x="824" y="790" width="416" height="56" rx="11" class="subtle"/><text x="1032" y="812" class="tunnelName">H6P9S · 影像剪辑</text><text x="1032" y="830" class="time">2026/11/02 17:00:00</text></g>
  <rect x="824" y="854" width="416" height="25" rx="12.5" fill="#eaf2ff"/><text x="1032" y="871" text-anchor="middle" font-size="14" fill="#3c29cf">⌄</text>
</svg>

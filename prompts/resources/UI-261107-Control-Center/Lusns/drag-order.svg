<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Lusns 控制中心磁贴排序交互示意</title>
  <desc id="desc">磁贴向右跟随指针移动，前方磁贴向左平滑让位；释放后完成排序。磁贴排序只在切换隧道上方的磁贴区进行。</desc>
  <defs>
    <marker id="purpleArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3c29cf"/></marker>
    <marker id="grayArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7884a3"/></marker>
    <filter id="lift" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3c29cf" flood-opacity=".25"/></filter>
    <style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#151b3e}.small{font-size:15px;fill:#7884a3}.tile{fill:#edf4fc;stroke:#dce8f4}.icon{font-size:30px;text-anchor:middle;dominant-baseline:central}.caption{font-size:18px;font-weight:700}.foot{font-size:14px;fill:#7884a3}</style>
  </defs>
  <rect width="1200" height="650" fill="#eef6ff"/>
  <text x="60" y="62" font-size="24" font-weight="700">磁贴拖动排序 · 交互示意</text>
  <text x="60" y="96" class="small">以下为同一次向右拖动的三个瞬间；箭头与标注仅用于说明交互。</text>
  <g transform="translate(55 140)">
    <rect width="342" height="360" rx="16" fill="#f7fbff" stroke="#dce8f4"/>
    <text x="22" y="39" class="caption">① 按住磁贴</text>
    <text x="22" y="67" class="small">选中「主题」磁贴</text>
    <g class="tile"><rect x="24" y="100" width="54" height="48" rx="12"/><rect x="90" y="100" width="54" height="48" rx="12"/><rect x="156" y="100" width="54" height="48" rx="12"/><rect x="222" y="100" width="54" height="48" rx="12"/></g>
    <g class="icon"><text x="51" y="124">↻</text><text x="117" y="124">◐</text><text x="183" y="124">⚙</text><text x="249" y="124">▩</text></g>
    <rect x="90" y="100" width="54" height="48" rx="12" fill="none" stroke="#3c29cf" stroke-width="2"/>
    <text x="117" y="181" text-anchor="middle" font-size="13" fill="#3c29cf">按住</text>
    <path d="M22 215H320" stroke="#dce8f4"/><text x="171" y="248" text-anchor="middle" class="caption">切换隧道</text><rect x="27" y="270" width="288" height="50" rx="10" fill="#edf4fc" stroke="#dce8f4"/><text x="171" y="300" text-anchor="middle" font-size="14">K7M2P · 灵感工作室</text>
  </g>
  <g transform="translate(429 140)">
    <rect width="342" height="360" rx="16" fill="#f7fbff" stroke="#dce8f4"/>
    <text x="22" y="39" class="caption">② 拖动并让位</text>
    <text x="22" y="67" class="small">磁贴跟随指针，前方磁贴反向移动</text>
    <g class="tile"><rect x="24" y="100" width="54" height="48" rx="12"/><rect x="222" y="100" width="54" height="48" rx="12"/></g>
    <g class="icon"><text x="51" y="124">↻</text><text x="249" y="124">▩</text></g>
    <rect x="90" y="100" width="54" height="48" rx="12" fill="none" stroke="#b4c3dd" stroke-dasharray="4 4"/>
    <rect x="115" y="100" width="54" height="48" rx="12" fill="#edf4fc" stroke="#d4dbea"/><text x="142" y="124" class="icon">⚙</text>
    <g filter="url(#lift)"><rect x="171" y="86" width="54" height="48" rx="12" fill="#e5f0ff" stroke="#3c29cf" stroke-width="2"/></g><text x="198" y="110" class="icon">◐</text>
    <path d="M163 160H211" stroke="#3c29cf" stroke-width="2" marker-end="url(#purpleArrow)"/><path d="M155 185H107" stroke="#7884a3" stroke-width="2" marker-end="url(#grayArrow)"/>
    <text x="187" y="207" text-anchor="middle" class="foot">拖动 →　　← 让位</text>
    <path d="M22 215H320" stroke="#dce8f4"/><text x="171" y="248" text-anchor="middle" class="caption">切换隧道</text><rect x="27" y="270" width="288" height="50" rx="10" fill="#edf4fc" stroke="#dce8f4"/><text x="171" y="300" text-anchor="middle" font-size="14">K7M2P · 灵感工作室</text>
  </g>
  <g transform="translate(803 140)">
    <rect width="342" height="360" rx="16" fill="#f7fbff" stroke="#dce8f4"/>
    <text x="22" y="39" class="caption">③ 松手完成排序</text>
    <text x="22" y="67" class="small">磁贴回落到新位置</text>
    <g class="tile"><rect x="24" y="100" width="54" height="48" rx="12"/><rect x="90" y="100" width="54" height="48" rx="12"/><rect x="156" y="100" width="54" height="48" rx="12"/><rect x="222" y="100" width="54" height="48" rx="12"/></g>
    <g class="icon"><text x="51" y="124">↻</text><text x="117" y="124">⚙</text><text x="183" y="124">◐</text><text x="249" y="124">▩</text></g>
    <path d="M22 215H320" stroke="#dce8f4"/><text x="171" y="248" text-anchor="middle" class="caption">切换隧道</text><rect x="27" y="270" width="288" height="50" rx="10" fill="#edf4fc" stroke="#dce8f4"/><text x="171" y="300" text-anchor="middle" font-size="14">K7M2P · 灵感工作室</text>
  </g>
  <text x="60" y="551" class="small">宽屏拖动范围限定在磁贴区，磁贴不会被拖到「切换隧道」下方。</text>
  <text x="60" y="580" class="foot">实际动画需在实现阶段完成；SVG 用三个静态状态说明目标效果。</text>
</svg>

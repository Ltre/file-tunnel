<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drop2Tunnel SNS Cookie Sync</title>
    <style>
        :root { color-scheme: light dark; --bg:#f4f6fa; --panel:#fff; --text:#172033; --muted:#667085; --line:#d7deea; --primary:#2563eb; --ok:#047857; --error:#c62828; }
        * { box-sizing: border-box; }
        body { margin:0; min-width:360px; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
        main { width:min(620px,100%); margin:auto; padding:18px; }
        h1 { margin:0 0 4px; font-size:20px; letter-spacing:0; }
        p { margin:0 0 14px; color:var(--muted); }
        .panel { padding:16px; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
        .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
        .section-head strong { font-size:15px; }
        .server-list { margin-bottom:16px; border-block:1px solid var(--line); }
        .server-row { display:flex; align-items:center; gap:10px; min-height:54px; padding:9px 0; border-bottom:1px solid var(--line); }
        .server-row:last-child { border-bottom:0; }
        .server-main { min-width:0; flex:1; }
        .server-main strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .server-meta { color:var(--muted); font-size:12px; }
        .server-actions { display:flex; gap:4px; flex:none; }
        .empty { padding:16px 0; color:var(--muted); text-align:center; }
        label { display:grid; gap:6px; margin-bottom:12px; font-weight:650; }
        input[type="url"], input[type="password"], input[type="number"] { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; font:inherit; }
        .toggle { display:flex; grid-template-columns:none; align-items:center; gap:8px; }
        .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .actions { display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; margin-top:14px; }
        button { border:0; border-radius:6px; padding:9px 12px; font:inherit; font-weight:700; cursor:pointer; }
        button.primary { background:var(--primary); color:#fff; }
        button.icon { display:grid; place-items:center; width:34px; height:34px; padding:0; background:color-mix(in srgb,var(--muted) 12%,transparent); font-size:18px; }
        button.icon.primary { background:var(--primary); color:#fff; }
        button.danger { color:var(--error); }
        dialog { width:min(440px,calc(100% - 28px)); padding:0; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); }
        dialog::backdrop { background:rgba(10,18,32,.55); }
        .dialog-body { padding:18px; }
        .dialog-title { margin:0 0 14px; font-size:17px; }
        .dialog-status { min-height:20px; color:var(--error); font-size:13px; }
        #status { min-height:42px; margin-top:12px; padding:9px 10px; border-radius:6px; background:color-mix(in srgb,var(--muted) 10%,transparent); white-space:pre-wrap; word-break:break-word; }
        #status.ok { color:var(--ok); } #status.error { color:var(--error); }
        @media (max-width:460px) { .row { grid-template-columns:1fr; } }
        @media (prefers-color-scheme:dark) { :root { --bg:#0f1521; --panel:#171f2d; --text:#edf2ff; --muted:#a7b1c2; --line:#334055; } }
    </style>
</head>
<body>
<main>
    <h1>Drop2Tunnel SNS Cookie Sync</h1>
    <p>支持 YouTube / YT Music、TikTok、Facebook、Instagram、Threads、LINE、Twitter 和 X。未检测到登录态的平台会跳过，不会覆盖服务器配置。</p>
    <section class="panel">
        <div class="section-head">
            <strong>Drop2Tunnel 服务器</strong>
            <button class="icon primary" id="addServerBtn" type="button" title="添加服务器" aria-label="添加服务器">+</button>
        </div>
        <div class="server-list" id="serverList"></div>
        <div class="row">
            <label>定时同步间隔（分钟）
                <input id="intervalMinutes" type="number" min="5" max="1440" step="1">
            </label>
            <label>重开 SNS 页面触发间隔（分钟）
                <input id="pageResyncMinutes" type="number" min="5" max="1440" step="1">
            </label>
        </div>
        <label class="toggle"><input id="enabled" type="checkbox"> 启用自动同步</label>
        <div class="actions">
            <button id="syncBtn" type="button">立即同步</button>
            <button class="primary" id="saveBtn" type="button">保存设置</button>
        </div>
        <div id="status">正在读取设置...</div>
    </section>
</main>
<dialog id="serverDialog">
    <div class="dialog-body">
        <h2 class="dialog-title" id="serverDialogTitle">添加服务器</h2>
        <label>服务器地址
            <input id="serverUrl" type="url" placeholder="https://tun.example.com" autocomplete="off">
        </label>
        <label>同步密钥
            <input id="syncToken" type="password" placeholder="在该服务器的 /sns-cookies 生成" autocomplete="off">
        </label>
        <div class="dialog-status" id="serverDialogStatus"></div>
        <div class="actions">
            <button id="cancelServerBtn" type="button">取消</button>
            <button class="primary" id="saveServerBtn" type="button">保存服务器</button>
        </div>
    </div>
</dialog>
<script src="options.js"></script>
</body>
</html>

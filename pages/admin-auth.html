<!doctype html>
<html lang="zh-CN" translate="no">
<head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>管理员身份验证</title>
    <script src="/client/qrcode-1.0.0.min.js"></script>
    <script src="/client/simplewebauthn.js"></script>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;color:#e5e7eb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}.panel{width:min(440px,100%);background:#1f2937;border:1px solid #374151;border-radius:8px;padding:28px;box-shadow:0 18px 50px #0007}h1{font-size:22px;margin:0 0 8px}p{color:#9ca3af;line-height:1.6}label{display:block;margin:16px 0 8px;color:#d1d5db;font-weight:650}.qr{width:208px;height:208px;background:#fff;padding:4px;margin:18px auto}.secret{font:600 15px ui-monospace,monospace;word-break:break-all;text-align:center;color:#93c5fd}input,button{width:100%;height:46px;border-radius:6px;font-size:17px}input{border:1px solid #4b5563;background:#111827;color:#fff;padding:0 14px;letter-spacing:5px;text-align:center}#issuer{letter-spacing:0;text-align:left}button{border:0;background:#2563eb;color:#fff;font-weight:700;margin-top:12px;cursor:pointer}.status{min-height:22px;margin-top:12px;color:#fca5a5}.hidden{display:none}
    </style>
    <script defer src="/client/i18n-bootstrap.js?v=20260812-1"></script>
    <script defer src="/client/i18n.js?v=20260812-1"></script>
    <style>.admin-auth-progress{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px;border:1px solid #3b82f655;border-radius:8px;background:#2563eb16;color:#bfdbfe;font-size:14px;line-height:1.6}.admin-auth-spinner{flex:none;width:23px;height:23px;border:3px solid #93c5fd40;border-top-color:#93c5fd;border-radius:50%;animation:admin-auth-spin .8s linear infinite}.admin-auth-progress.hidden{display:none}#dbscLoading:not(.hidden)~.status{color:#93c5fd}@keyframes admin-auth-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.admin-auth-spinner{animation:none}}</style>
</head>
<body>
<main class="panel">
    <h1 id="title">管理员身份验证</h1>
    <p id="description">请输入身份验证器中的 6 位动态验证码。</p>
    <button id="dbscFallback" type="button" class="hidden">确认此浏览器不支持 DBSC，使用 TOTP＋管理员 Passkey</button>
    <section id="setup" class="hidden">
        <label for="issuer">验证器中的名称</label>
        <input id="issuer" type="text" maxlength="64" autocomplete="off" placeholder="例如：新加坡文件隧道">
        <div id="qr" class="qr"></div>
        <div id="secret" class="secret"></div>
        <p>请先填写便于区分服务器的名称，再用 Google Authenticator 或其他兼容应用扫码，最后输入动态验证码完成绑定。</p>
    </section>
    <form id="form"><input id="token" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000"><button type="submit">验证并继续</button></form>
    <div id="dbscLoading" class="admin-auth-progress hidden" role="status" aria-live="polite" aria-busy="false"><span class="admin-auth-spinner" aria-hidden="true"></span><span>正在尝试原生 DBSC 设备绑定，请稍候…</span></div>
    <section id="passkeyStep" class="hidden"><label id="passkeyRemarkLabel" for="adminPasskeyRemark">管理员 Passkey 备注名</label><input id="adminPasskeyRemark" maxlength="100" autocomplete="off" style="letter-spacing:0;text-align:left"><p>管理员 Passkey 与前台账号相互独立，备注名仅供识别。</p><button id="passkeyContinue" type="button">验证管理员 Passkey</button></section>
    <div id="status" class="status"></div>
</main>
<script>
const setupEl=document.getElementById('setup');
const statusEl=document.getElementById('status');
const issuerInput=document.getElementById('issuer');
const next=new URLSearchParams(location.search).get('next')||'/admin';
let mode='login';
let issuerTimer=null;
let localHttpTestAllowed=false;
let submitting=false;
let pollingRevision=0,passkeyEnrollment=false;
const t=value=>window.TunnelI18n?.t(value)||value;
const fallbackButton=document.getElementById('dbscFallback');
const passkeyStep=document.getElementById('passkeyStep');
async function postAuth(path,body){const response=await fetch('/api/admin/auth/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const value=await response.json().catch(()=>({}));if(!response.ok)throw Error(value.error||'HTTP '+response.status);return value;}
function showPasskey(enrollment){
    setBindingLoading(false);
    pollingRevision++;passkeyEnrollment=enrollment===true;fallbackButton.classList.add('hidden');
    document.getElementById('form').classList.add('hidden');setupEl.classList.add('hidden');passkeyStep.classList.remove('hidden');
    document.getElementById('adminPasskeyRemark').hidden=!passkeyEnrollment;
    document.getElementById('passkeyRemarkLabel').hidden=!passkeyEnrollment;
    document.getElementById('passkeyContinue').textContent=t(passkeyEnrollment?'绑定管理员 Passkey 并继续':'验证管理员 Passkey');
    statusEl.textContent=t(passkeyEnrollment?'TOTP 已通过，请先绑定管理员 Passkey，完成后才能进入后台。':'请验证管理员 Passkey；TOTP 凭证仍在有效期内。');
}
fallbackButton.onclick=async()=>{fallbackButton.disabled=true;try{const data=await postAuth('dbsc-unavailable',{confirmed:true});showPasskey(data.enrollmentRequired);}catch(error){statusEl.textContent=t('验证失败，请稍后重试')+' ['+error.message+']';}finally{fallbackButton.disabled=false;}};
document.getElementById('passkeyContinue').onclick=async()=>{
    const button=document.getElementById('passkeyContinue');button.disabled=true;
    try{
        if(!window.isSecureContext||!window.PublicKeyCredential||!window.SimpleWebAuthnBrowser)throw Error('ADMIN_PASSKEY_BROWSER_UNAVAILABLE');
        const path=passkeyEnrollment?'passkey/register/':'passkey/';
        const flow=await postAuth(path+'options',passkeyEnrollment?{remark:document.getElementById('adminPasskeyRemark').value.trim()}:{});
        const response=passkeyEnrollment?await SimpleWebAuthnBrowser.startRegistration({optionsJSON:flow.options}):await SimpleWebAuthnBrowser.startAuthentication({optionsJSON:flow.options});
        await postAuth(path+'verify',{flow_id:flow.flow_id,response});
        const status=await fetch('/api/admin/auth/status',{cache:'no-store'}).then(response=>response.json());
        if(!status.authenticated)throw Error('ADMIN_AUTH_REQUIRED');location.replace(next);
    }catch(error){statusEl.textContent=t('管理员 Passkey 验证未完成，请重试')+' ['+error.message+']';}
    finally{button.disabled=false;}
};

// A native registration result and this browser's server-side state determine
// the next step. User-agent strings never decide authentication capability.
function bindingProgressMessage(state){
    if(state==='registration-rejected')return '浏览器已发起 DBSC 注册，但签名证明未通过服务端校验，尚未取得管理员权限。请重新验证；持续失败时提供错误码 ADMIN_DBSC_PROOF_REJECTED。';
    if(state==='expired')return 'DBSC 待绑定状态已过期，尚未取得管理员权限。请重新输入动态验证码。';
    if(state==='awaiting-registration')return '尚未收到浏览器的原生 DBSC 注册请求，尚未取得管理员权限。请确认浏览器已启用原生 DBSC，并通过证书有效的 HTTPS 访问。';
    return '';
}

function isLocalHttpTest(){return localHttpTestAllowed&&['http:','https:'].includes(location.protocol);}
function setFormDisabled(disabled){
    document.getElementById('token').disabled=disabled;
    issuerInput.disabled=disabled;
    document.querySelector('#form button').disabled=disabled;
}
function setBindingLoading(loading){const node=document.getElementById('dbscLoading');node.classList.toggle('hidden',!loading);node.setAttribute('aria-busy',String(loading));}
function requireLoginContext(){
    if(location.protocol==='https:'||isLocalHttpTest())return true;
    setFormDisabled(true);
    statusEl.textContent='管理员 DBSC 登录需要证书有效的 HTTPS。请通过 HTTPS 地址重新打开；HTTP localhost 不会触发浏览器原生注册。';
    return false;
}

function renderSetup(setup){
    document.getElementById('secret').textContent=setup.secret;
    const qr=document.getElementById('qr');
    qr.replaceChildren();
    new QRCode(qr,{text:setup.uri,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});
}

async function refreshSetup(){
    if(!requireLoginContext())return;
    const issuer=issuerInput.value.trim();
    const response=await fetch(`/api/admin/auth/status?issuer=${encodeURIComponent(issuer)}`,{cache:'no-store'});
    const data=await response.json();
    if(data.setup)renderSetup(data.setup);
}

async function init(){
    setFormDisabled(true);
    const response=await fetch('/api/admin/auth/status',{cache:'no-store'});
    const data=await response.json();
    localHttpTestAllowed=data.localHttpTestAllowed===true;
    if(!requireLoginContext())return;
    if(data.authenticated){location.replace(next);return;}
    if(data.factors?.passkeyRequired){showPasskey(data.factors.enrollmentRequired);return;}
    if(!data.configured){
        if(!data.setupAllowed){
            document.getElementById('title').textContent='请在服务器本机完成首次绑定';
            document.getElementById('description').textContent='为防止公网访客抢先绑定管理员身份，请通过 127.0.0.1 或私网地址访问本页完成初始化。';
            document.getElementById('form').classList.add('hidden');
            return;
        }
        mode='setup';
        document.getElementById('title').textContent='绑定管理员身份验证器';
        document.getElementById('description').textContent='这是首次设置。TOTP 验证后优先进行 DBSC 绑定；不支持 DBSC 的浏览器必须绑定管理员 Passkey。';
        setupEl.classList.remove('hidden');
        issuerInput.value=data.setup.issuer||'Instant Tunnel Admin';
        renderSetup(data.setup);
    }
    if(isLocalHttpTest())document.getElementById('description').textContent='本地直连测试模式：仅验证 TOTP，不要求 DBSC 或管理员 Passkey。';
    setFormDisabled(false);
}

issuerInput.addEventListener('input',()=>{
    clearTimeout(issuerTimer);
    issuerTimer=setTimeout(()=>refreshSetup().catch(error=>{statusEl.textContent=error.message;}),250);
});

document.getElementById('form').addEventListener('submit',async event=>{
    event.preventDefault();
    if(submitting||!requireLoginContext())return;
    submitting=true;
    setFormDisabled(true);
    try{
    statusEl.textContent='正在验证...';
    const response=await fetch(`/api/admin/auth/${mode}`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:document.getElementById('token').value,issuer:issuerInput.value.trim()})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok){statusEl.textContent=data.error==='invalid-totp'?'验证码无效或已过期':'验证失败，请稍后重试';return;}
    if(data.factorRequired){showPasskey(data.enrollmentRequired);return;}
    if(isLocalHttpTest()){
        if(data.localTest!==true||data.dbscRequired!==false){statusEl.textContent='验证失败，请稍后重试';return;}
        document.querySelector('#form button').disabled=true;
        const check=await fetch('/api/admin/auth/status',{cache:'no-store'}).then(response=>response.ok?response.json():null).catch(()=>null);
        if(check){
            localHttpTestAllowed=check.localHttpTestAllowed===true;
            if(!requireLoginContext())return;
            if(check.authenticated){location.replace(next);return;}
        }
        statusEl.textContent='验证失败，请稍后重试';
        return;
    }
    statusEl.textContent='动态验证码已通过，正在等待浏览器完成 DBSC 安全设备绑定…';
    setBindingLoading(true);
    document.querySelector('#form button').disabled=true;
    const deadline=Date.now()+120000;
    const revision=++pollingRevision;
    let lastBindingState='';
    while(Date.now()<deadline){
        await new Promise(resolve=>setTimeout(resolve,1500));
        const check=await fetch('/api/admin/auth/status',{cache:'no-store'}).then(response=>response.json()).catch(()=>({}));
        if(revision!==pollingRevision)return;
        if(check.authenticated){location.replace(next);return;}
        fallbackButton.classList.toggle('hidden',check.factors?.fallbackAllowed!==true);
        const state=check.bindingStatus?.state;
        if(state){
            lastBindingState=state;
            const message=bindingProgressMessage(state);
            if(message)statusEl.textContent=message;
            if(state==='registration-rejected'||state==='expired')return;
        }
    }
    document.querySelector('#form button').disabled=false;
    statusEl.textContent=bindingProgressMessage(lastBindingState)||'DBSC 绑定未完成，尚未取得管理员权限。请确认浏览器支持并已启用原生 DBSC、设备安全密钥可用，以及 HTTPS 证书有效，再重新验证。';
    }catch(_){
        statusEl.textContent='验证失败，请稍后重试';
    }finally{
        setBindingLoading(false);
        submitting=false;
        if(requireLoginContext())setFormDisabled(false);
    }
});

init().catch(error=>{statusEl.textContent=error.message;});
</script>
</body>
</html>

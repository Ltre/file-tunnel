<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员安全中心</title>
<style>body{background:#101827;color:#e5edf7;font:15px system-ui,sans-serif;margin:0;padding:26px}main{max-width:1200px;margin:auto}h1{font-size:24px}p{color:#9eabc2}table{border-collapse:collapse;width:100%;background:#1c2637}th,td{padding:12px;border-bottom:1px solid #354254;text-align:left;font-size:13px}th{color:#acc4e9}button{background:#b91c1c;color:white;border:0;border-radius:5px;padding:8px 13px;cursor:pointer}button:disabled{opacity:.5;cursor:default}.scroll{overflow-x:auto}.tag{color:#9de9bb}.error{color:#fca5a5}.admin-passkeys{margin-top:30px;padding:22px;border:1px solid #354254;border-radius:12px;background:#172133}.admin-passkeys h2{margin:0;font-size:20px}.admin-passkey-form{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:20px 0}.admin-passkey-form label{display:grid;gap:8px;flex:1;min-width:180px;max-width:440px}.admin-passkey-form input{box-sizing:border-box;width:100%;min-height:40px;padding:9px 12px;font:inherit;border:1px solid #64748b;border-radius:7px;background:#101827;color:inherit}.admin-passkey-form button{min-height:40px;background:#2563eb}.admin-passkeys [role=status]{min-height:22px}.admin-passkeys .message-content{overflow-wrap:anywhere}button:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){body{padding:14px}.admin-passkeys{padding:16px}.admin-passkey-form label{max-width:none}.admin-passkey-form button{width:100%}}</style></head>
<body><main><h1>安全中心 · 管理员会话</h1><p>管理员会话及绑定状态</p>
<p id="state">正在加载…</p><div class="scroll"><table><thead><tr><th>设备型号</th><th>操作系统</th><th>浏览器</th><th>最近活动</th><th>有效期</th><th>认证方式</th><th>操作</th></tr></thead><tbody id="sessions"></tbody></table></div>
<section class="admin-passkeys" aria-labelledby="adminPasskeyTitle"><h2 id="adminPasskeyTitle">管理员 Passkey</h2><p>仅用于管理员后台身份验证，与前台账号的 Passkey 相互独立，不能互用。</p><form id="adminPasskeyForm" class="admin-passkey-form"><label for="adminPasskeyRemark">备注名<input id="adminPasskeyRemark" maxlength="100" autocomplete="off"></label><button type="submit" id="bindAdminPasskey" disabled>绑定管理员 Passkey</button></form><p id="adminPasskeyStatus" role="status">正在加载…</p><div class="scroll"><table><thead><tr><th>备注名</th><th>RP ID</th><th>创建时间</th><th>最近使用</th></tr></thead><tbody id="adminPasskeys"></tbody></table></div></section>
</main><script src="/client/i18n-bootstrap.js" defer></script><script src="/client/i18n.js" defer></script><script src="/client/simplewebauthn.js" defer></script><script src="/client/admin-security.js" defer></script></body></html>

<!doctype html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/tunnel-icon.svg" type="image/svg+xml">
  <title>Drop2Tunnel - 即时传输隧道</title>
  <link rel="stylesheet" href="/client/tunnel-entry.css">
  <link rel="stylesheet" href="/client/tunnel-landing.css">
  <script defer src="/client/i18n-bootstrap.js?v=20260812-1"></script>
  <script defer src="/client/i18n.js?v=20260812-1"></script>
  <script defer src="/client/tunnel-code-scanner.js"></script>
  <script defer src="/client/tunnel-entry.js"></script>
</head>
<body class="tunnel-entry-page">
  <script>try { document.body.dataset.theme = document.documentElement.dataset.theme = localStorage.getItem('uiTheme') || ''; } catch (_) {}</script>
  <div class="tunnel-landing" id="sessionLanding" hidden>
    <header class="tunnel-landing-topbar"><strong><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12.8 3.1c3.3-1.4 6.8-1.1 7.8-.9.2 1 .5 4.5-.9 7.8-1.2 2.8-3.6 5.3-6.2 6.8l-6-6c1.5-2.6 4-5 6.8-6.2"/>
      <circle cx="15.7" cy="7.1" r="2.1"/>
      <path d="m7.5 10.8-3.7.6-2.3 4.1 6.4-.8M13.5 16.8l-.6 3.7-4.1 2.3.8-6.4M5.7 17.3c-1.5 0-3.2 1.7-3.2 4.2 2.5 0 4.2-1.7 4.2-3.2"/>
    </svg><span>Drop2Tunnel Studio</span></strong></header>
    <main class="tunnel-landing-main">
      <h1>加入数据隧道</h1>
      <p class="tunnel-landing-intro">输入朋友提供的暗号，或扫描隧道码</p>
      <p id="sharedFilesNotice" hidden></p>
      <div class="tunnel-code-inputs" id="tunnelCodeInputs" aria-label="5 位传输隧道暗号">
        <input inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="1" aria-label="暗号第 1 位">
        <input inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="1" aria-label="暗号第 2 位">
        <input inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="1" aria-label="暗号第 3 位">
        <input inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="1" aria-label="暗号第 4 位">
        <input inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="1" aria-label="暗号第 5 位">
      </div>
      <button type="button" id="landingScanBtn"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 2H4a2 2 0 0 0-2 2v3M13 2h3a2 2 0 0 1 2 2v3M2 13v3a2 2 0 0 0 2 2h3M18 13v3a2 2 0 0 1-2 2h-3M1 10h18"/>
      </svg><span>扫描隧道码</span></button>
      <div class="landing-session-picker" id="landingSessionPicker" hidden><label for="landingSessionSelect">或进入已加入的隧道</label></div>
      <div class="tunnel-landing-actions">
        <select id="landingSessionSelect" size="1" aria-label="已加入的隧道" hidden></select>
        <button type="button" class="btn btn-primary" id="landingRecentBtn" hidden>进入所选隧道</button>
        <button type="button" class="btn btn-secondary" id="landingCreateBtn">我没有暗号，创建一个隧道</button>
      </div>
      <div class="tunnel-landing-note" id="landingNote" aria-live="polite"></div>
    </main>
  </div>
</body>
</html>

<!doctype html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/tunnel-icon.svg" type="image/svg+xml">
  <title>Drop2Tunnel - 即时传输隧道</title>
  <link rel="stylesheet" href="/client/tunnel-entry.css">
  <script defer src="/client/i18n-catalog.js?v=20260812-1"></script>
  <script defer src="/client/i18n.js?v=20260812-1"></script>
  <script defer src="/client/tunnel-entry.js"></script>
</head>
<body>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('uiTheme') || ''; } catch (_) {}</script>
  <header>🚀 Drop2Tunnel Studio</header>
  <main id="sessionLanding" hidden>
    <h1>请输入朋友给你的数据隧道暗号</h1>
    <p id="sharedFilesNotice" hidden></p>
    <div id="tunnelCodeInputs" aria-label="5 位传输隧道暗号">
      <input inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="1" aria-label="暗号第 1 位">
      <input inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="1" aria-label="暗号第 2 位">
      <input inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="1" aria-label="暗号第 3 位">
      <input inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="1" aria-label="暗号第 4 位">
      <input inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="1" aria-label="暗号第 5 位">
    </div>
    <div id="landingSessionPicker" hidden>
      <label for="landingSessionSelect">或选择已加入的传输隧道</label>
      <select id="landingSessionSelect"></select>
    </div>
    <div class="actions"><button id="landingRecentBtn" hidden>进入所选隧道</button><button id="landingCreateBtn">我没有暗号，创建一个隧道</button></div>
    <p id="landingNote" aria-live="polite"></p>
  </main>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram 网盘 · 协同编辑</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#e9eef2;color:#223047}button,input{font:inherit}button{cursor:pointer;border:1px solid #b9c8d1;border-radius:8px;background:#fff;color:inherit;padding:8px 12px}button:hover{background:#eaf5f5}.page{max-width:1080px;margin:auto;padding:16px;min-height:100dvh;display:flex;flex-direction:column;gap:12px}header,.toolbar,nav,.row,.actions{display:flex;align-items:center;gap:8px}header{justify-content:space-between}header h1{font-size:1.25rem;margin:0}header a{font-size:.9rem}nav{overflow-x:auto;white-space:nowrap;padding:8px 0}nav button{flex:none}.toolbar{flex-wrap:wrap}.status{min-height:1.5em;color:#3b6471}.status.error{color:#bf3b42}.list{flex:1;min-height:0;overflow-y:auto;background:#fff;border:1px solid #d1dce2;border-radius:12px;padding:8px}.row{padding:10px;border-bottom:1px solid #e5ebef;min-width:0}.row:last-child{border-bottom:0}.row>.icon{font-size:1.5rem;min-width:36px;text-align:center}.row>.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row>.name button{border:0;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis}.row small{color:#687d8b}.actions{flex-wrap:wrap;justify-content:end}.actions button{font-size:.85rem}.error-panel{padding:20px;border:1px solid #e5a3a7;border-radius:10px;background:#fff4f4}dialog{width:min(90vw,900px);max-height:90dvh;border:0;border-radius:12px;padding:12px;background:#17212b;color:white}dialog::backdrop{background:#111a24bd}dialog header{margin-bottom:10px}dialog header button{color:#223047}dialog img,dialog video{display:block;max-width:100%;max-height:75dvh;margin:auto;object-fit:contain}dialog audio{width:100%}@media(max-width:680px){.page{padding:8px}.row{flex-wrap:wrap}.actions{width:100%;justify-content:start}.row small{display:none}}
</style>
</head>
<body><main class="page"><header><h1 id="title">Telegram 网盘 · 协同编辑</h1><a href="/">返回功能首页</a></header><p class="status" id="status">正在验证邀请…</p><nav id="breadcrumbs" aria-label="协同目录路径"></nav><div class="toolbar" id="toolbar"><button id="uploadBtn" type="button">上传文件</button><button id="mkdirBtn" type="button">新建目录</button><button id="refreshBtn" type="button">刷新</button><input id="fileInput" type="file" multiple hidden></div><section class="list" id="list"></section><dialog id="preview"><header><strong id="previewName"></strong><button id="previewClose" type="button" aria-label="关闭预览">×</button></header><div id="previewBody"></div></dialog></main>
<script src="/client/disk-client.js"></script>
<script src="/client/disk-collaboration.js"></script>
</body></html>

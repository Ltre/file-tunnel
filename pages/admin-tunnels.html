<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隧道列表</title><link rel="stylesheet" href="/client/admin-overview.css"><script defer src="/client/i18n-catalog.js"></script><script defer src="/client/i18n.js"></script></head><body><div class="container"><div class="header"><h1>隧道列表</h1><div><a class="btn btn-secondary" href="/admin/home">返回总览</a><button class="btn" onclick="loadData()">刷新</button><span id="lastUpdate"></span></div></div>        <div class="panel">
            <div class="panel-header">
                <span>🔗 隧道列表</span>
                <button class="btn btn-secondary" onclick="exportSessions()">📥 导出</button>
            </div>
            <div class="panel-content"><div class="session-filter-controls">
<label>活跃状态<select id="sessionActiveFilter"><option value="all">全部</option><option value="yes">活跃</option><option value="no">不活跃</option></select></label>
<label>真实设备在线状态<select id="sessionOnlineFilter"><option value="all">全部</option><option value="yes">有真实设备在线</option><option value="no">无真实设备在线</option></select></label>
<label>传输记录<select id="sessionRecordsFilter"><option value="all">全部</option><option value="yes">有传输记录</option><option value="no">无传输记录</option></select></label>
<span id="sessionFilterSummary" role="status"></span></div>
                <div id="sessionList" class="session-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div>暂无会话</div>
                    </div>
                </div>
            </div>
        </div></div><script src="/socket.io/socket.io.js"></script><script src="/client/admin-overview.js"></script></body></html>

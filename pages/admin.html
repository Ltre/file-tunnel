<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即时传输隧道 - 管理后台</title>
    <link rel="stylesheet" href="/client/admin-overview.css">
    <script defer src="/client/i18n-bootstrap.js?v=20260812-1"></script>
    <script defer src="/client/i18n.js?v=20260812-1"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 隧道总览</h1>
            <p>即时传输隧道管理</p>
            <button class="btn btn-secondary" id="adminLogoutBtn" type="button">退出管理会话</button>
        </div>
        
        <div class="panel">
            <div class="panel-header panel-header-extensions">
                <span>扩展配置</span>
                <nav class="admin-extension-links" aria-label="扩展配置">
                    <a class="btn btn-secondary" href="/tgbot">配置 telegram bot</a>
                    <a class="btn btn-secondary" href="/sns-cookies">配置 SNS cookies</a>
                    <a class="btn btn-secondary" href="/sns-dl">SNS 媒体下载</a>
                    <a class="btn btn-secondary" href="/media-library">视频画面提取与多媒体收藏</a>
                    <a class="btn btn-secondary" href="/youtube-premium-dl">私人 YouTube Premium 下载</a>
                    <a class="btn btn-secondary" href="/video-transcode">视频转码</a>
                    <a class="btn btn-secondary" href="/disk-management">网盘用户与内容审核</a>
                    <a class="btn btn-secondary" href="/s3-management">S3 API 第三方接入</a>
                    <a class="btn btn-secondary" href="/data-usage">数据目录空间占用</a>
                    <a class="btn btn-secondary" href="/telegram-content">Telegram Bot 内容管理</a>
                    <a class="btn btn-secondary" href="/system-backup">系统备份程序</a>
                    <a class="btn btn-secondary" href="/admin/tunnels">隧道列表</a>
                    <a class="btn btn-secondary" href="/admin/tunnel-permissions">隧道权限与隧道管理设备</a>
                    <a class="btn btn-secondary" href="/admin/devices">所有访问设备</a>
                    <a class="btn btn-secondary" href="/admin/magnets">已分享磁链</a>
                </nav>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span>📊 统计信息</span>
                <span id="lastUpdate">更新于: --</span>
            </div>
            <div class="panel-content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalSessions">0</div>
                        <div class="stat-label">审计隧道总数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalDevices">0</div>
                        <div class="stat-label">真实在线设备</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalMessages">0</div>
                        <div class="stat-label">传输记录总数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalFiles">0</div>
                        <div class="stat-label">传输文件总数</div>
                    </div>
                </div>
            </div>
        </div>
        


    </div>
    
    <button class="refresh-btn" onclick="loadData()" title="刷新">🔄</button>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="/client/admin-overview.js"></script>

</body>
</html>

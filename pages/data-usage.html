<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>数据占用 - 管理后台</title>
    <style>
        *{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#243746;font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}button,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:14px 22px;background:#173a51;color:#fff;box-shadow:0 2px 12px #132b3c33}header h1{margin:0;font-size:20px;flex:1}header a,header button{border:1px solid #ffffff66;border-radius:7px;background:transparent;color:#fff;padding:7px 12px;text-decoration:none}main{display:grid;gap:16px;max-width:1000px;margin:18px auto;padding:0 16px}.card{overflow:hidden;border:1px solid #d4dfe7;border-radius:12px;background:#fff;box-shadow:0 2px 10px #173a5112}.card h2{margin:0;padding:14px 16px;border-bottom:1px solid #e0e7ed;font-size:17px}.breadcrumbs{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:14px 16px;border-bottom:1px solid #e0e7ed;white-space:nowrap}.breadcrumbs button{border:0;background:none;color:#145f82;padding:4px}.summary{padding:10px 16px;color:#607184}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px 16px;border-top:1px solid #e4eaef;text-align:left}th{background:#f5f8fa}.size{text-align:right;font-variant-numeric:tabular-nums}.name{border:0;background:none;color:#145f82;padding:0;text-align:left}.name.file{color:inherit;cursor:default}.empty,.status{padding:28px;text-align:center;color:#687b89}.error{color:#ad2831}.cache-content{padding:16px}.cache-note{margin:0 0 14px;color:#607184}.cache-form{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,1fr) auto;align-items:end;gap:12px}.cache-field{display:grid;gap:5px;font-weight:700}.cache-field select{width:100%;min-height:39px;padding:7px 9px;border:1px solid #c7d4de;border-radius:7px;background:#fff;color:inherit}.cache-clear{min-height:39px;padding:7px 16px;border:1px solid #a92935;border-radius:7px;background:#b82e3b;color:#fff;font-weight:700}.cache-clear:disabled{cursor:wait;opacity:.6}.cache-summary{margin:14px 0 0;padding:11px 13px;border-radius:8px;background:#f3f7fa;color:#425b6c}.cache-status{min-height:22px;margin:9px 0 0;color:#286b50}.cache-status.error{color:#ad2831}
        @media(max-width:600px){header{padding:11px 12px;flex-wrap:wrap}header h1{font-size:18px}main{margin:10px auto;padding:0 10px}th,td{padding:10px}.cache-form{grid-template-columns:1fr}.cache-clear{width:100%}}
    </style>
</head>
<body>
    <header><a href="/admin">← 管理后台</a><h1>.tunnel-data 空间占用</h1><button id="refreshBtn" type="button">刷新</button></header>
    <main>
        <section class="card"><nav id="breadcrumbs" class="breadcrumbs" aria-label="当前目录"></nav><div id="summary" class="summary"></div><div id="content" class="table-wrap"><div class="status">正在统计占用空间…</div></div></section>
        <section class="card" aria-labelledby="partCacheTitle">
            <h2 id="partCacheTitle">网盘分片缓存清理专区</h2>
            <div class="cache-content">
                <p class="cache-note">只清理 <code>.tunnel-data/telegram-part-cache</code> 中所选用户与分区的服务端临时分片；不会删除 Telegram 文件、浏览器缓存或其它数据。正在读取的分片会跳过。</p>
                <div class="cache-form">
                    <label class="cache-field">用户<select id="partCacheUser"><option value="">全部用户</option></select></label>
                    <label class="cache-field">分区<select id="partCacheSpace"><option value="">默认分区</option></select></label>
                    <button class="cache-clear" id="clearPartCacheBtn" type="button">清除缓存</button>
                </div>
                <p class="cache-summary" id="partCacheSummary" role="status">正在计算所选范围的缓存占用…</p>
                <p class="cache-status" id="partCacheStatus" role="status"></p>
            </div>
        </section>
    </main>
    <script>
        const state = { path: '', users: new Map(), cacheGeneration: 0 };
        const $ = id => document.getElementById(id);
        const formatSize = value => { const units=['B','KB','MB','GB','TB']; let size=Number(value)||0,index=0; while(size>=1024&&index<units.length-1){size/=1024;index++;} return `${size.toFixed(index&&size<10?2:index&&size<100?1:0)} ${units[index]}`; };
        async function jsonRequest(url, options = {}) {
            const response = await fetch(url, { credentials:'same-origin', cache:'no-store', ...options, headers:{ 'Content-Type':'application/json', ...options.headers } });
            const data = await response.json().catch(()=>({}));
            if (!response.ok) throw new Error(data.error || `HTTP_${response.status}`);
            return data;
        }
        function renderBreadcrumbs(path) {
            const nav=$('breadcrumbs'); nav.replaceChildren();
            const parts=String(path||'').split('/').filter(Boolean); let current='';
            [['.tunnel-data',''],...parts.map(name=>[name,current=current?current+'/'+name:name])].forEach(([name,value],index)=>{ if(index){const sep=document.createElement('span');sep.textContent='›';nav.append(sep);} const button=document.createElement('button');button.type='button';button.textContent=name;button.onclick=()=>loadUsage(value);nav.append(button); });
            nav.scrollLeft=nav.scrollWidth;
        }
        async function loadUsage(path=state.path) {
            state.path=path; renderBreadcrumbs(path); $('content').innerHTML='<div class="status">正在执行空间统计…</div>';
            try {
                const data=await jsonRequest('/api/admin/data-usage?path='+encodeURIComponent(path));
                state.path=data.path||''; renderBreadcrumbs(state.path); $('summary').textContent=`${data.entries.length} 项 · 合计 ${formatSize(data.totalSize)} · ${new Date(data.generatedAt).toLocaleString('zh-CN',{hour12:false})}`;
                if(!data.entries.length){$('content').innerHTML='<div class="empty">此目录为空</div>';return;}
                const table=document.createElement('table');table.innerHTML='<thead><tr><th>名称</th><th>类型</th><th class="size">占用空间</th></tr></thead>';const body=document.createElement('tbody');
                for(const entry of data.entries){const row=document.createElement('tr'),nameCell=document.createElement('td'),name=document.createElement('button');name.type='button';name.className='name '+entry.kind;name.textContent=(entry.kind==='directory'?'📁 ':'📄 ')+entry.name;if(entry.kind==='directory')name.onclick=()=>loadUsage(entry.path);else name.disabled=true;nameCell.append(name);const kind=document.createElement('td');kind.textContent=entry.kind==='directory'?'目录':'文件';const size=document.createElement('td');size.className='size';size.textContent=formatSize(entry.size);row.append(nameCell,kind,size);body.append(row);}table.append(body);$('content').replaceChildren(table);
            } catch(error) { const status=document.createElement('div');status.className='status error';status.textContent=String(error.message||error);$('content').replaceChildren(status); }
        }
        function collectCacheUsers(overview) {
            state.users.clear();
            for (const system of overview.systems || []) for (const user of system.users || []) {
                let saved=state.users.get(user.userId);
                if(!saved){saved={id:user.userId,label:user.username||user.name||user.userId,spaces:new Set()};state.users.set(user.userId,saved);}
                for(const space of user.spaces||[]) saved.spaces.add(String(space.diskSpace||''));
            }
        }
        function renderCacheUsers() {
            const select=$('partCacheUser'), selected=select.value;
            select.replaceChildren(new Option('全部用户',''));
            for(const user of [...state.users.values()].sort((a,b)=>a.label.localeCompare(b.label,'zh-CN'))){const option=new Option(`${user.label}（${user.id}）`,user.id);select.append(option);}
            if(state.users.has(selected)) select.value=selected;
            renderCacheSpaces();
        }
        function renderCacheSpaces() {
            const select=$('partCacheSpace'), selected=select.value, userId=$('partCacheUser').value;
            const spaces=userId ? new Set(state.users.get(userId)?.spaces||[]) : new Set([...state.users.values()].flatMap(user=>[...user.spaces]));
            select.replaceChildren(new Option('默认分区',''));
            for(const space of [...spaces].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh-CN'))) select.append(new Option(space,space));
            if([...select.options].some(option=>option.value===selected)) select.value=selected; else select.value='';
            refreshCacheSummary();
        }
        function cacheSelection() { const userId=$('partCacheUser').value,diskSpace=$('partCacheSpace').value; return { scope:userId?'user-partition':'partition', user_id:userId, disk_space:diskSpace }; }
        function cacheTarget() { const user=$('partCacheUser').selectedOptions[0]?.textContent||'全部用户',space=$('partCacheSpace').selectedOptions[0]?.textContent||'默认分区'; return `${user} / ${space}`; }
        async function refreshCacheSummary() {
            const generation=++state.cacheGeneration,selection=cacheSelection(),target=cacheTarget(),summary=$('partCacheSummary'); summary.textContent='正在计算所选范围的缓存占用…';
            try { const query=new URLSearchParams(selection); const data=await jsonRequest('/api/telegram/disk-admin/part-cache?'+query); if(generation===state.cacheGeneration) summary.textContent=`${target}：${data.files} 个临时分片 · ${formatSize(data.bytes)}${data.inflight?` · ${data.inflight} 项正在读取`:''}`; }
            catch(error){if(generation===state.cacheGeneration)summary.textContent='缓存占用读取失败：'+error.message;}
        }
        async function loadCacheOptions() {
            try { collectCacheUsers(await jsonRequest('/api/telegram/disk-admin/storage-overview')); renderCacheUsers(); }
            catch(error){$('partCacheSummary').textContent='用户与分区读取失败：'+error.message;}
        }
        async function clearPartCache() {
            const target=cacheTarget(); if(!confirm(`确定清理 ${target} 的服务端网盘分片缓存吗？\n正在读取的分片会跳过。`)) return;
            const button=$('clearPartCacheBtn'),status=$('partCacheStatus'); button.disabled=true;status.className='cache-status';status.textContent='正在清理所选缓存…';
            try { const result=await jsonRequest('/api/telegram/disk-admin/part-cache',{method:'DELETE',body:JSON.stringify(cacheSelection())});status.textContent=`已清理 ${result.removedFiles} 个分片，释放 ${formatSize(result.removedBytes)}；跳过 ${result.busyFiles} 个正在读取的分片${result.failedFiles?`；${result.failedFiles} 个清理失败`:'。'}`;await Promise.all([refreshCacheSummary(),loadUsage()]); }
            catch(error){status.className='cache-status error';status.textContent='清理失败：'+error.message;}
            finally{button.disabled=false;}
        }
        $('partCacheUser').onchange=renderCacheSpaces;
        $('partCacheSpace').onchange=refreshCacheSummary;
        $('clearPartCacheBtn').onclick=clearPartCache;
        $('refreshBtn').onclick=()=>Promise.all([loadUsage(),loadCacheOptions()]);
        Promise.all([loadUsage(),loadCacheOptions()]);
    </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频转码</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#223047;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:13px 18px;background:#24364f;color:#fff}header a{color:#fff;text-decoration:none}header h1{font-size:18px;margin:0;flex:1}main{width:min(1100px,calc(100% - 24px));margin:18px auto;display:grid;gap:16px}.panel{background:#fff;border:1px solid #cad3df;border-radius:14px;padding:17px;box-shadow:0 8px 25px #20334d12}.panel h2{margin:0 0 12px;font-size:17px}.panel-title{display:flex;align-items:center;gap:12px}.panel-title h2{flex:1}.panel-title a{color:#2767a8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field[hidden]{display:none}.field.full{grid-column:1/-1}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #aab8c9;border-radius:8px;padding:9px;background:#fff;color:inherit}textarea{min-height:310px;font-family:ui-monospace,Consolas,monospace;resize:vertical}button,.button{border:0;border-radius:9px;padding:9px 13px;background:#e5ebf3;color:#24364f;cursor:pointer}.primary{background:#3478c5;color:#fff}.danger{background:#b83c47;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.profile-description{margin:7px 0 13px;color:#657186}.upload-progress{height:8px;background:#dce4ee;border-radius:5px;overflow:hidden;margin-top:10px}.upload-progress i{display:block;height:100%;background:#377dcc;width:0}.task-list{display:grid;gap:10px}.task{border:1px solid #ccd5e1;border-radius:11px;padding:12px}.task-head{display:flex;gap:10px;align-items:start}.task-head strong{flex:1}.status{border-radius:10px;padding:2px 8px;background:#e6edf6;font-size:12px}.task small{color:#66758a}.task pre{max-height:240px;overflow:auto;white-space:pre-wrap;background:#172231;color:#dbe8f4;padding:8px;border-radius:7px}.scheme-panel summary{cursor:pointer;font-weight:700}.hint{color:#657186}.error{color:#b72838}.cache-stats{display:flex;gap:14px;flex-wrap:wrap}.cache-stats span{padding:6px 9px;border-radius:8px;background:#eef3f8}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:13px}main{margin:12px auto}.task-head{flex-wrap:wrap}}
</style></head><body><header><a href="/admin">← 后台</a><h1>视频转码</h1><button id="refreshBtn">刷新任务</button></header><main>
<section class="panel"><h2>提交转码任务</h2><div class="grid"><label class="field full">转码方案<select id="profileSelect"></select></label><div class="field full profile-description" id="profileDescription"></div><label class="field full">输出文件后缀<select id="outputExtension"><option value="mkv">mkv</option><option value="mp4">mp4</option><option value="webm">webm</option><option value="mov">mov</option><option value="m4v">m4v</option><option value="mp3">mp3</option><option value="m4a">m4a</option><option value="aac">aac</option><option value="flac">flac</option><option value="wav">wav</option><option value="ogg">ogg</option></select></label><div id="dynamicFields" class="grid field full"></div><div id="sourceTaskHint" class="field full hint" hidden></div><label class="field full" id="sourceFileField">源视频<input id="sourceFile" type="file" accept="video/*,.mkv,.mov,.m4v,.webm" required></label></div><div class="actions"><button class="primary" id="submitBtn">上传并开始转码</button><span id="submitStatus"></span></div><div class="upload-progress" id="uploadProgress" hidden><i></i></div></section>
<details class="panel scheme-panel"><summary>自定义转码方案</summary><div class="panel-title"><p class="hint">方案由 fields、rules、steps、output 四部分组成。每个 FFmpeg 参数以独立 argv 保存，服务端不会通过 Shell 执行。</p><a href="/video-transcode-guide.html" target="_blank">帮助文档</a></div><label class="field">方案 JSON<textarea id="profileJson"></textarea></label><div class="actions"><button id="newProfileBtn">新建模板</button><button class="primary" id="saveProfileBtn">保存方案</button><button class="danger" id="deleteProfileBtn">删除当前自定义方案</button></div></details>
<section class="panel"><div class="panel-title"><h2>转码缓存清理</h2><button id="refreshCacheBtn">刷新占用</button></div><div class="cache-stats" id="cacheStats">正在统计…</div><p class="hint">残留缓存会清理孤立目录及失败、取消任务的文件；“全部已结束缓存”还会删除已完成任务的结果文件，删除后不能再下载。</p><div class="actions"><button id="clearBrowserCacheBtn">清理浏览器僵尸缓存</button><button id="clearResidualCacheBtn">清理服务器残留缓存</button><button class="danger" id="clearFinishedCacheBtn">清理服务器全部已结束缓存</button></div></section>
<section class="panel"><h2>转码任务</h2><div class="task-list" id="taskList"><p class="hint">正在加载…</p></div></section>
</main><script>
const $=id=>document.getElementById(id);let profiles=[],tasks=[],refreshTimer,openLogTasks=new Set();
const sourceParams=new URLSearchParams(location.search),sourceKind=sourceParams.get('source'),sourceTaskId=sourceParams.get('taskId');
const sourceRef=['sns','youtube'].includes(sourceKind)&&sourceTaskId?{kind:sourceKind,taskId:sourceTaskId}:null;
async function api(path,options={}){const response=await fetch(path,{credentials:'same-origin',...options,headers:{...(options.body&&typeof options.body==='string'?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const type=response.headers.get('content-type')||'';const data=type.includes('json')?await response.json():null;if(!response.ok)throw new Error(data?.error||`HTTP ${response.status}`);return data;}
function escapeHtml(value){const div=document.createElement('div');div.textContent=String(value||'');return div.innerHTML}
function currentProfile(){return profiles.find(item=>item.id===$('profileSelect').value)}
function renderProfiles(selected=''){const previous=selected||$('profileSelect').value;profiles.sort((a,b)=>Number(b.builtin)-Number(a.builtin)||a.name.localeCompare(b.name,'zh-CN'));$('profileSelect').innerHTML=profiles.map(item=>`<option value="${item.id}">${item.builtin?'内置 · ':''}${escapeHtml(item.name)}</option>`).join('');if(profiles.some(item=>item.id===previous))$('profileSelect').value=previous;renderForm()}
function renderForm(){const profile=currentProfile();if(!profile)return;$('outputExtension').value=profile.output?.extension||'mp4';$('profileDescription').textContent=profile.description||'';$('dynamicFields').innerHTML=profile.fields.map(field=>{const required=field.required?' required':'';const value=field.default??'';if(field.type==='select')return`<label class="field">${escapeHtml(field.label)}<select data-param="${field.name}"${required}>${(field.options||[]).map(option=>`<option value="${escapeHtml(option)}"${option===value?' selected':''}>${escapeHtml(option||'默认')}</option>`).join('')}</select></label>`;if(field.type==='boolean')return`<label class="field"><span>${escapeHtml(field.label)}</span><input data-param="${field.name}" type="checkbox"></label>`;return`<label class="field">${escapeHtml(field.label)}<input data-param="${field.name}" type="${field.type==='number'?'number':'text'}" value="${escapeHtml(value)}" placeholder="${escapeHtml(field.placeholder||'')}"${field.min!==undefined?` min="${field.min}"`:''}${field.max!==undefined?` max="${field.max}"`:''}${required}></label>`}).join('');$('profileJson').value=JSON.stringify(profile,null,2);$('deleteProfileBtn').disabled=profile.builtin===true}
function params(){return Object.fromEntries([...document.querySelectorAll('[data-param]')].map(input=>[input.dataset.param,input.type==='checkbox'?input.checked:input.value.trim()]))}
async function upload(){const file=$('sourceFile').files[0],profile=currentProfile();if((!file&&!sourceRef)||!profile)return alert('请选择源视频和转码方案');const status=$('submitStatus'),bar=$('uploadProgress'),fill=bar.querySelector('i');$('submitBtn').disabled=true;try{if(sourceRef){status.textContent='正在接入服务器视频缓存…';await api('/api/video-transcode/source-tasks',{method:'POST',body:JSON.stringify({profileId:profile.id,params:params(),sourceKind:sourceRef.kind,sourceTaskId:sourceRef.taskId,outputExtension:$('outputExtension').value})});status.textContent='任务已加入转码队列';loadTasks();return;}status.textContent='正在创建任务…';const created=await api('/api/video-transcode/tasks',{method:'POST',body:JSON.stringify({profileId:profile.id,params:params(),fileName:file.name,size:file.size,type:file.type,outputExtension:$('outputExtension').value})});bar.hidden=false;await new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('PUT',`/api/video-transcode/tasks/${encodeURIComponent(created.task.id)}/input`);xhr.withCredentials=true;xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.upload.onprogress=event=>{if(event.lengthComputable){const value=Math.round(event.loaded/event.total*100);fill.style.width=value+'%';status.textContent=`正在上传源视频 ${value}%`}};xhr.onerror=()=>reject(new Error('源视频上传失败'));xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve():reject(new Error(JSON.parse(xhr.responseText||'{}').error||`HTTP ${xhr.status}`));xhr.send(file)});status.textContent='正在加入转码队列…';await api(`/api/video-transcode/tasks/${encodeURIComponent(created.task.id)}/start`,{method:'POST'});status.textContent='任务已开始';$('sourceFile').value='';loadTasks()}catch(error){status.textContent=error.message;status.className='error'}finally{$('submitBtn').disabled=false;setTimeout(()=>{bar.hidden=true;fill.style.width='0'},1200)}}
function renderTasks(){const list=$('taskList');list.querySelectorAll('article[data-task-id] details[open]').forEach(details=>openLogTasks.add(details.closest('article').dataset.taskId));if(!tasks.length){list.innerHTML='<p class="hint">暂无转码任务</p>';return}list.innerHTML=tasks.map(task=>`<article class="task" data-task-id="${task.id}"><div class="task-head"><strong>${escapeHtml(task.fileName)}</strong><span class="status">${escapeHtml(task.status)}</span></div><div>${escapeHtml(task.profileName)} · ${escapeHtml(task.phase||'')}</div><small>${new Date(task.createdAt).toLocaleString()}${task.progress!==null&&task.progress!==undefined?` · ${task.progress}%`:''}${task.error?` · <span class="error">${escapeHtml(task.error)}</span>`:''}</small>${task.logs?.length?`<details${openLogTasks.has(task.id)?' open':''}><summary>FFmpeg 输出</summary><pre>${escapeHtml(task.logs.slice(-20).join('\n'))}</pre></details>`:''}<div class="actions">${task.status==='completed'&&!task.cacheCleared?`<a class="button primary" href="/api/video-transcode/tasks/${task.id}/download">下载结果</a>`:''}${['uploading','queued','running'].includes(task.status)?'<button data-action="cancel">取消</button>':'<button data-action="delete">删除任务</button>'}</div></article>`).join('')}
function formatBytes(value){const size=Number(value)||0;if(size<1024)return size+' B';const units=['KB','MB','GB','TB'];let current=size,index=-1;do{current/=1024;index++}while(current>=1024&&index<units.length-1);return current.toFixed(current>=10?1:2)+' '+units[index]}
async function loadCacheStats(){try{const stats=await api('/api/video-transcode/cache');$('cacheStats').innerHTML=`<span>总计 ${formatBytes(stats.totalBytes)}</span><span>执行中 ${formatBytes(stats.activeBytes)}</span><span>已结束 ${formatBytes(stats.finishedBytes)}</span><span>孤立残留 ${formatBytes(stats.orphanBytes)}</span>`}catch(error){$('cacheStats').textContent=error.message}}
async function clearServerCache(scope){const label=scope==='finished'?'全部已结束任务缓存':'服务器残留缓存';if(!confirm(`确定清理${label}吗？`))return;const result=await api('/api/video-transcode/cache/cleanup',{method:'POST',body:JSON.stringify({scope})});alert(`已清理 ${result.removedEntries} 项，共 ${formatBytes(result.removedBytes)}`);await Promise.all([loadTasks(),loadCacheStats()])}
async function clearBrowserZombieCache(){let removed=0;if('caches'in window){for(const name of await caches.keys()){const cache=await caches.open(name);for(const request of await cache.keys())if(new URL(request.url).pathname.startsWith('/api/video-transcode/')){if(await cache.delete(request))removed++}}}for(const key of Object.keys(localStorage))if(key.startsWith('videoTranscode:')){localStorage.removeItem(key);removed++}if(indexedDB.databases){for(const database of await indexedDB.databases())if(/^Drop2TunnelVideoTranscode/i.test(database.name||'')){indexedDB.deleteDatabase(database.name);removed++}}alert(`浏览器转码僵尸缓存清理完成，共处理 ${removed} 项`)}
async function loadTasks(){try{tasks=(await api('/api/video-transcode/tasks')).tasks;renderTasks()}catch(error){$('taskList').innerHTML=`<p class="error">${escapeHtml(error.message)}</p>`}}
async function loadProfiles(selected=''){profiles=(await api('/api/video-transcode/profiles')).profiles;renderProfiles(selected)}
async function loadSourceRef(){
    if(!sourceRef)return;
    $('sourceFileField').hidden=true;$('sourceFile').required=false;$('sourceTaskHint').hidden=false;
    $('submitBtn').textContent='使用服务器缓存并开始转码';$('submitBtn').disabled=true;
    $('sourceTaskHint').textContent='正在确认来源任务的服务器视频缓存…';
    try{
        const source=await api(`/api/video-transcode/sources/${encodeURIComponent(sourceRef.kind)}/${encodeURIComponent(sourceRef.taskId)}`);
        $('sourceTaskHint').textContent=`来源：${source.name} · ${formatBytes(source.size)} · 任务 ${sourceRef.taskId}。选择或新建转码方案后即可开始。`;
        $('submitBtn').disabled=false;
    }catch(error){$('sourceTaskHint').textContent=`来源文件不可用：${error.message}`;$('sourceTaskHint').classList.add('error');}
}
const template={id:'my-transcode',name:'我的转码方案',description:'自定义 FFmpeg argv 方案',fields:[{name:'CRF',type:'number',label:'CRF',default:'28',min:0,max:51}],rules:[],steps:[{name:'转码',args:['-i','${INPUT_FILE}','-c:v','libx265','-crf','${CRF}','-c:a','copy','${OUTPUT_FILE}']}],output:{extension:'mkv',nameTemplate:'${BASENAME}-custom.${EXT}'}};
$('profileSelect').onchange=renderForm;$('submitBtn').onclick=upload;$('refreshBtn').onclick=loadTasks;$('refreshCacheBtn').onclick=loadCacheStats;$('clearBrowserCacheBtn').onclick=()=>clearBrowserZombieCache().catch(error=>alert(error.message));$('clearResidualCacheBtn').onclick=()=>clearServerCache('residual').catch(error=>alert(error.message));$('clearFinishedCacheBtn').onclick=()=>clearServerCache('finished').catch(error=>alert(error.message));$('newProfileBtn').onclick=()=>{$('profileJson').value=JSON.stringify(template,null,2)};$('saveProfileBtn').onclick=async()=>{try{const profile=JSON.parse($('profileJson').value);await api('/api/video-transcode/profiles',{method:'POST',body:JSON.stringify(profile)});await loadProfiles(profile.id);alert('方案已保存')}catch(error){alert(`保存失败：${error.message}`)}};$('deleteProfileBtn').onclick=async()=>{const profile=currentProfile();if(!profile||profile.builtin||!confirm(`确定删除方案“${profile.name}”吗？`))return;try{await api(`/api/video-transcode/profiles/${encodeURIComponent(profile.id)}`,{method:'DELETE'});await loadProfiles()}catch(error){alert(error.message)}};$('taskList').addEventListener('toggle',event=>{const card=event.target.closest?.('[data-task-id]');if(!card||event.target.tagName!=='DETAILS')return;if(event.target.open)openLogTasks.add(card.dataset.taskId);else openLogTasks.delete(card.dataset.taskId)},true);$('taskList').onclick=async event=>{const action=event.target.dataset.action,card=event.target.closest('[data-task-id]');if(!action||!card)return;try{if(action==='cancel'&&confirm('确定取消这个转码任务吗？'))await api(`/api/video-transcode/tasks/${card.dataset.taskId}/cancel`,{method:'POST'});if(action==='delete'&&confirm('确定删除任务及其输入、输出缓存吗？'))await api(`/api/video-transcode/tasks/${card.dataset.taskId}`,{method:'DELETE'});loadTasks()}catch(error){alert(error.message)}};
Promise.all([loadProfiles(),loadTasks(),loadCacheStats(),loadSourceRef()]).catch(error=>alert(error.message));refreshTimer=setInterval(()=>{if(!document.hidden)loadTasks()},2500);
</script></body></html>

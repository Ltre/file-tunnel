<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频转码</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#223047;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:13px 18px;background:#24364f;color:#fff}header a{color:#fff;text-decoration:none}header h1{font-size:18px;margin:0;flex:1}main{width:min(1100px,calc(100% - 24px));margin:18px auto;display:grid;gap:16px}.panel{background:#fff;border:1px solid #cad3df;border-radius:14px;padding:17px;box-shadow:0 8px 25px #20334d12}.panel h2{margin:0 0 12px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #aab8c9;border-radius:8px;padding:9px;background:#fff;color:inherit}textarea{min-height:310px;font-family:ui-monospace,Consolas,monospace;resize:vertical}button,.button{border:0;border-radius:9px;padding:9px 13px;background:#e5ebf3;color:#24364f;cursor:pointer}.primary{background:#3478c5;color:#fff}.danger{background:#b83c47;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.profile-description{margin:7px 0 13px;color:#657186}.upload-progress{height:8px;background:#dce4ee;border-radius:5px;overflow:hidden;margin-top:10px}.upload-progress i{display:block;height:100%;background:#377dcc;width:0}.task-list{display:grid;gap:10px}.task{border:1px solid #ccd5e1;border-radius:11px;padding:12px}.task-head{display:flex;gap:10px;align-items:start}.task-head strong{flex:1}.status{border-radius:10px;padding:2px 8px;background:#e6edf6;font-size:12px}.task small{color:#66758a}.task pre{max-height:130px;overflow:auto;white-space:pre-wrap;background:#172231;color:#dbe8f4;padding:8px;border-radius:7px}.scheme-panel summary{cursor:pointer;font-weight:700}.hint{color:#657186}.error{color:#b72838}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:13px}main{margin:12px auto}.task-head{flex-wrap:wrap}}
</style></head><body><header><a href="/admin">← 后台</a><h1>视频转码</h1><button id="refreshBtn">刷新任务</button></header><main>
<section class="panel"><h2>提交转码任务</h2><div class="grid"><label class="field full">转码方案<select id="profileSelect"></select></label><div class="field full profile-description" id="profileDescription"></div><div id="dynamicFields" class="grid field full"></div><label class="field full">源视频<input id="sourceFile" type="file" accept="video/*,.mkv,.mov,.m4v,.webm" required></label></div><div class="actions"><button class="primary" id="submitBtn">上传并开始转码</button><span id="submitStatus"></span></div><div class="upload-progress" id="uploadProgress" hidden><i></i></div></section>
<details class="panel scheme-panel"><summary>自定义转码方案</summary><p class="hint">方案由 fields、rules、steps、output 四部分组成。每个 FFmpeg 参数以独立 argv 保存，服务端不会通过 Shell 执行。</p><label class="field">方案 JSON<textarea id="profileJson"></textarea></label><div class="actions"><button id="newProfileBtn">新建模板</button><button class="primary" id="saveProfileBtn">保存方案</button><button class="danger" id="deleteProfileBtn">删除当前自定义方案</button></div></details>
<section class="panel"><h2>转码任务</h2><div class="task-list" id="taskList"><p class="hint">正在加载…</p></div></section>
</main><script>
const $=id=>document.getElementById(id);let profiles=[],tasks=[],refreshTimer;
async function api(path,options={}){const response=await fetch(path,{credentials:'same-origin',...options,headers:{...(options.body&&typeof options.body==='string'?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const type=response.headers.get('content-type')||'';const data=type.includes('json')?await response.json():null;if(!response.ok)throw new Error(data?.error||`HTTP ${response.status}`);return data;}
function escapeHtml(value){const div=document.createElement('div');div.textContent=String(value||'');return div.innerHTML}
function currentProfile(){return profiles.find(item=>item.id===$('profileSelect').value)}
function renderProfiles(selected=''){const previous=selected||$('profileSelect').value;profiles.sort((a,b)=>Number(b.builtin)-Number(a.builtin)||a.name.localeCompare(b.name,'zh-CN'));$('profileSelect').innerHTML=profiles.map(item=>`<option value="${item.id}">${item.builtin?'内置 · ':''}${escapeHtml(item.name)}</option>`).join('');if(profiles.some(item=>item.id===previous))$('profileSelect').value=previous;renderForm()}
function renderForm(){const profile=currentProfile();if(!profile)return;$('profileDescription').textContent=profile.description||'';$('dynamicFields').innerHTML=profile.fields.map(field=>{const required=field.required?' required':'';const value=field.default??'';if(field.type==='select')return`<label class="field">${escapeHtml(field.label)}<select data-param="${field.name}"${required}>${(field.options||[]).map(option=>`<option value="${escapeHtml(option)}"${option===value?' selected':''}>${escapeHtml(option)}</option>`).join('')}</select></label>`;if(field.type==='boolean')return`<label class="field"><span>${escapeHtml(field.label)}</span><input data-param="${field.name}" type="checkbox"></label>`;return`<label class="field">${escapeHtml(field.label)}<input data-param="${field.name}" type="${field.type==='number'?'number':'text'}" value="${escapeHtml(value)}" placeholder="${escapeHtml(field.placeholder||'')}"${field.min!==undefined?` min="${field.min}"`:''}${field.max!==undefined?` max="${field.max}"`:''}${required}></label>`}).join('');$('profileJson').value=JSON.stringify(profile,null,2);$('deleteProfileBtn').disabled=profile.builtin===true}
function params(){return Object.fromEntries([...document.querySelectorAll('[data-param]')].map(input=>[input.dataset.param,input.type==='checkbox'?input.checked:input.value.trim()]))}
async function upload(){const file=$('sourceFile').files[0],profile=currentProfile();if(!file||!profile)return alert('请选择源视频和转码方案');const status=$('submitStatus'),bar=$('uploadProgress'),fill=bar.querySelector('i');$('submitBtn').disabled=true;try{status.textContent='正在创建任务…';const created=await api('/api/video-transcode/tasks',{method:'POST',body:JSON.stringify({profileId:profile.id,params:params(),fileName:file.name,size:file.size,type:file.type})});bar.hidden=false;await new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('PUT',`/api/video-transcode/tasks/${encodeURIComponent(created.task.id)}/input`);xhr.withCredentials=true;xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.upload.onprogress=event=>{if(event.lengthComputable){const value=Math.round(event.loaded/event.total*100);fill.style.width=value+'%';status.textContent=`正在上传源视频 ${value}%`}};xhr.onerror=()=>reject(new Error('源视频上传失败'));xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve():reject(new Error(JSON.parse(xhr.responseText||'{}').error||`HTTP ${xhr.status}`));xhr.send(file)});status.textContent='正在加入转码队列…';await api(`/api/video-transcode/tasks/${encodeURIComponent(created.task.id)}/start`,{method:'POST'});status.textContent='任务已开始';$('sourceFile').value='';loadTasks()}catch(error){status.textContent=error.message;status.className='error'}finally{$('submitBtn').disabled=false;setTimeout(()=>{bar.hidden=true;fill.style.width='0'},1200)}}
function renderTasks(){const list=$('taskList');if(!tasks.length){list.innerHTML='<p class="hint">暂无转码任务</p>';return}list.innerHTML=tasks.map(task=>`<article class="task" data-task-id="${task.id}"><div class="task-head"><strong>${escapeHtml(task.fileName)}</strong><span class="status">${escapeHtml(task.status)}</span></div><div>${escapeHtml(task.profileName)} · ${escapeHtml(task.phase||'')}</div><small>${new Date(task.createdAt).toLocaleString()}${task.progress!==null&&task.progress!==undefined?` · ${task.progress}%`:''}${task.error?` · <span class="error">${escapeHtml(task.error)}</span>`:''}</small>${task.logs?.length?`<details><summary>FFmpeg 输出</summary><pre>${escapeHtml(task.logs.slice(-20).join('\n'))}</pre></details>`:''}<div class="actions">${task.status==='completed'?`<a class="button primary" href="/api/video-transcode/tasks/${task.id}/download">下载结果</a>`:''}${['uploading','queued','running'].includes(task.status)?'<button data-action="cancel">取消</button>':'<button data-action="delete">删除任务</button>'}</div></article>`).join('')}
async function loadTasks(){try{tasks=(await api('/api/video-transcode/tasks')).tasks;renderTasks()}catch(error){$('taskList').innerHTML=`<p class="error">${escapeHtml(error.message)}</p>`}}
async function loadProfiles(selected=''){profiles=(await api('/api/video-transcode/profiles')).profiles;renderProfiles(selected)}
const template={id:'my-transcode',name:'我的转码方案',description:'自定义 FFmpeg argv 方案',fields:[{name:'CRF',type:'number',label:'CRF',default:'28',min:0,max:51}],rules:[],steps:[{name:'转码',args:['-i','${INPUT_FILE}','-c:v','libx265','-crf','${CRF}','-c:a','copy','${OUTPUT_FILE}']}],output:{extension:'mp4',nameTemplate:'${BASENAME}-custom.mp4'}};
$('profileSelect').onchange=renderForm;$('submitBtn').onclick=upload;$('refreshBtn').onclick=loadTasks;$('newProfileBtn').onclick=()=>{$('profileJson').value=JSON.stringify(template,null,2)};$('saveProfileBtn').onclick=async()=>{try{const profile=JSON.parse($('profileJson').value);await api('/api/video-transcode/profiles',{method:'POST',body:JSON.stringify(profile)});await loadProfiles(profile.id);alert('方案已保存')}catch(error){alert(`保存失败：${error.message}`)}};$('deleteProfileBtn').onclick=async()=>{const profile=currentProfile();if(!profile||profile.builtin||!confirm(`确定删除方案“${profile.name}”吗？`))return;try{await api(`/api/video-transcode/profiles/${encodeURIComponent(profile.id)}`,{method:'DELETE'});await loadProfiles()}catch(error){alert(error.message)}};$('taskList').onclick=async event=>{const action=event.target.dataset.action,card=event.target.closest('[data-task-id]');if(!action||!card)return;try{if(action==='cancel'&&confirm('确定取消这个转码任务吗？'))await api(`/api/video-transcode/tasks/${card.dataset.taskId}/cancel`,{method:'POST'});if(action==='delete'&&confirm('确定删除任务及其输入、输出缓存吗？'))await api(`/api/video-transcode/tasks/${card.dataset.taskId}`,{method:'DELETE'});loadTasks()}catch(error){alert(error.message)}};
Promise.all([loadProfiles(),loadTasks()]).catch(error=>alert(error.message));refreshTimer=setInterval(()=>{if(!document.hidden)loadTasks()},2500);
</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>网页 ZIP 预览</title>
    <style>
        *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#111923;color:#eef6ff;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 14px;background:#1b2938}header strong{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header button{border:1px solid #ffffff33;border-radius:8px;padding:7px 11px;background:#30465b;color:#fff}main{position:relative;flex:1;min-height:0}iframe{width:100%;height:100%;border:0;background:#fff}.status{position:absolute;inset:0;display:grid;place-items:center;padding:22px;text-align:center;background:#111923}.status[hidden]{display:none}.spinner{display:inline-block;width:34px;height:34px;margin-bottom:12px;border:4px solid #54718a;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <header><strong id="title">网页 ZIP 预览</strong><button id="reloadBtn" type="button">重新加载</button><button type="button" onclick="window.close()">关闭</button></header>
    <main><div class="status" id="status"><div><span class="spinner"></span><br><span id="statusText">正在等待网页 ZIP 缓存…</span></div></div><iframe id="viewer" sandbox="allow-same-origin allow-scripts allow-forms allow-modals allow-downloads allow-popups" hidden></iframe></main>
    <script src="/client/cache-store.js"></script>
    <script src="/client/folder-archive.js"></script>
    <script src="/client/web-zip-runtime.js"></script>
    <script>
        const fileId=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');
        const params=new URLSearchParams(location.search),pageTitle=params.get('name')||'网页 ZIP 预览';
        document.title=pageTitle;document.getElementById('title').textContent=pageTitle;
        let runtimeId='';
        const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
        function getRecord(){return new Promise((resolve,reject)=>{const open=indexedDB.open('TunnelDB');open.onerror=()=>reject(open.error);open.onsuccess=()=>{const db=open.result;if(!db.objectStoreNames.contains('files')){db.close();return resolve(null)}const tx=db.transaction('files','readonly'),request=tx.objectStore('files').get(fileId);request.onsuccess=()=>{resolve(request.result);db.close()};request.onerror=()=>{reject(request.error);db.close()}}})}
        async function materialize(record){if(!record)return null;if(record.data&&(record.data.byteLength||record.data.size))return record;if(record.cacheStoreRef&&window.createDrop2TunnelCacheStore){const cache=await window.createDrop2TunnelCacheStore({log:()=>{}});return cache.materialize(record)}return record}
        async function waitForFile(){const deadline=Date.now()+90000;while(Date.now()<deadline){const record=await materialize(await getRecord());if(record?.data&&(record.data.byteLength||record.data.size))return record;document.getElementById('statusText').textContent='正在从来源设备接收网页 ZIP…';await sleep(350)}throw new Error('等待网页 ZIP 缓存超时，请回到隧道页面重试')}
        async function render(){const status=document.getElementById('status'),statusText=document.getElementById('statusText'),viewer=document.getElementById('viewer');status.hidden=false;viewer.hidden=true;try{if(runtimeId)await WebZipRuntime.unmount(runtimeId).catch(()=>{});statusText.textContent='正在读取网页 ZIP 缓存…';const record=await waitForFile(),blob=record.data instanceof Blob?record.data:new Blob([record.data],{type:'application/zip'});statusText.textContent='正在解压网页 ZIP…';const entries=await FolderArchive.extractZip(blob),runtime=await WebZipRuntime.mount(entries,{onStatus:text=>{statusText.textContent=text;}});runtimeId=runtime.id;viewer.src=runtime.url;viewer.hidden=false;status.hidden=true}catch(error){status.hidden=false;statusText.textContent=`打开失败：${error.message}`}}
        document.getElementById('reloadBtn').onclick=render;
        window.addEventListener('beforeunload',()=>{if(runtimeId)WebZipRuntime.unmount(runtimeId).catch(()=>{})});
        render();
    </script>
</body>
</html>

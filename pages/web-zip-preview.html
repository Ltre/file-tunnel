<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网页 ZIP 预览</title>
<style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#111923;color:#eef6ff;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 14px;background:#1b2938}header strong{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header button{border:1px solid #ffffff33;border-radius:8px;padding:7px 11px;background:#30465b;color:#fff}main{position:relative;flex:1;min-height:0}iframe{width:100%;height:100%;border:0;background:#fff}.status{position:absolute;inset:0;display:grid;place-items:center;padding:22px;text-align:center;background:#111923}.status[hidden]{display:none}.spinner{display:inline-block;width:34px;height:34px;margin-bottom:12px;border:4px solid #54718a;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head><body><header><strong id="title">网页 ZIP 预览</strong><button id="reloadBtn" type="button">重新加载</button><button type="button" onclick="window.close()">关闭</button></header><main><div class="status" id="status"><div><span class="spinner"></span><br><span id="statusText">正在等待网页 ZIP 缓存…</span></div></div><iframe id="viewer" sandbox="allow-scripts allow-forms allow-modals" referrerpolicy="no-referrer" hidden></iframe></main>
<script src="/client/cache-store.js"></script><script src="/client/folder-archive.js"></script><script>
const fileId=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||''),params=new URLSearchParams(location.search),title=params.get('name')||'网页 ZIP 预览';document.title=title;document.getElementById('title').textContent=title;let objectUrls=[];
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));const bytes=data=>data instanceof Uint8Array?data:new Uint8Array(data||0);function parentPath(value){const parts=String(value||'').replace(/\/$/,'').split('/');parts.pop();return parts.length?parts.join('/')+'/':''}function resolvePath(base,reference){const result=base.split('/').filter(Boolean);for(const part of String(reference||'').replace(/\\/g,'/').split('/')){if(!part||part==='.')continue;if(part==='..')result.pop();else result.push(part)}return result.join('/')}function guessType(filePath){const ext=String(filePath).split('.').pop()?.toLowerCase();return({html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',mjs:'text/javascript',json:'application/json',svg:'image/svg+xml',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',mp3:'audio/mpeg',mp4:'video/mp4'})[ext]||'application/octet-stream'}
function getRecord(){return new Promise((resolve,reject)=>{const open=indexedDB.open('TunnelDB');open.onerror=()=>reject(open.error);open.onsuccess=()=>{const db=open.result;if(!db.objectStoreNames.contains('files')){db.close();return resolve(null)}const tx=db.transaction('files','readonly'),request=tx.objectStore('files').get(fileId);request.onsuccess=()=>{resolve(request.result);db.close()};request.onerror=()=>{reject(request.error);db.close()}}})}
async function materialize(record){if(!record)return null;if(record.data&&(record.data.byteLength||record.data.size))return record;if(record.cacheStoreRef&&window.createDrop2TunnelCacheStore){const cache=await window.createDrop2TunnelCacheStore({log:()=>{}});return cache.materialize(record)}return record}
async function waitForFile(){const deadline=Date.now()+90000;while(Date.now()<deadline){const record=await materialize(await getRecord());if(record?.data&&(record.data.byteLength||record.data.size))return record;document.getElementById('statusText').textContent='正在从来源设备接收网页 ZIP…';await sleep(350)}throw new Error('等待网页 ZIP 缓存超时，请回到隧道页面重试')}
async function render(){objectUrls.forEach(URL.revokeObjectURL);objectUrls=[];const status=document.getElementById('status'),viewer=document.getElementById('viewer');status.hidden=false;viewer.hidden=true;try{const record=await waitForFile(),blob=record.data instanceof Blob?record.data:new Blob([record.data],{type:'application/zip'}),entries=await FolderArchive.extractZip(blob),map=new Map();for(const item of entries.filter(item=>!item.path.endsWith('/'))){const url=URL.createObjectURL(new Blob([bytes(item.data)],{type:guessType(item.path)}));objectUrls.push(url);map.set(item.path,url)}for(const item of entries.filter(item=>/\.css$/i.test(item.path))){const base=parentPath(item.path),css=new TextDecoder().decode(bytes(item.data)).replace(/url\(\s*(['"]?)(?![a-z]+:|\/\/|#)([^)'"\s]+)\1\s*\)/gi,(whole,quote,ref)=>{const url=map.get(resolvePath(base,ref.split(/[?#]/)[0]));return url?`url("${url}")`:whole}),url=URL.createObjectURL(new Blob([css],{type:'text/css'}));objectUrls.push(url);map.set(item.path,url)}const entry=entries.find(item=>/(^|\/)index\.html?$/i.test(item.path))||entries.find(item=>/\.html?$/i.test(item.path));if(!entry)throw new Error('网页 ZIP 中没有 HTML 入口文件');const base=parentPath(entry.path),html=new TextDecoder().decode(bytes(entry.data)).replace(/\b(src|href)=(['"])(?![a-z]+:|\/\/|#)([^'"]+)\2/gi,(whole,attr,quote,ref)=>{const url=map.get(resolvePath(base,ref.split(/[?#]/)[0]));return url?`${attr}=${quote}${url}${quote}`:whole});viewer.srcdoc=html;viewer.hidden=false;status.hidden=true}catch(error){status.hidden=false;document.getElementById('statusText').textContent=error.message}}
document.getElementById('reloadBtn').onclick=render;window.addEventListener('beforeunload',()=>objectUrls.forEach(URL.revokeObjectURL));render();
</script></body></html>

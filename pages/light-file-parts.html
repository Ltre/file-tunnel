<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>继续光媒接收</title>
    <style>
        :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;color:#1f2937}
        *{box-sizing:border-box} body{margin:0;background:#f5f7fb;color:#1f2937}.page{min-height:100vh;padding:18px 18px 36px;max-width:980px;margin:auto}
        header{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:rgba(245,247,251,.94);backdrop-filter:blur(12px);padding:8px 0 14px;z-index:2}
        h1{font-size:1.35rem;margin:0;flex:1}.close{border:0;border-radius:999px;width:38px;height:38px;font-size:1.4rem;cursor:pointer;background:#fee2e2;color:#b91c1c}
        .note{font-size:.9rem;color:#64748b;margin:0 0 18px}.section{margin-top:22px}.section h2{font-size:1rem;margin:0 0 10px}.list{display:grid;gap:10px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
        .task{cursor:pointer}.task:hover{border-color:#818cf8}.title{font-weight:700;overflow-wrap:anywhere}.meta{font-size:.84rem;color:#64748b;margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}.progress{height:7px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:11px}.progress>i{display:block;height:100%;background:#4f46e5}.hash{font:11px ui-monospace,monospace;color:#94a3b8;overflow-wrap:anywhere;margin-top:7px}.empty{padding:22px;text-align:center;color:#94a3b8;border:1px dashed #cbd5e1;border-radius:14px}.link{display:inline-block;margin-top:9px;color:#4f46e5;text-decoration:none}
        @media(prefers-color-scheme:dark){:root,body{background:#111827;color:#e5e7eb}.page{background:#111827}header{background:rgba(17,24,39,.94)}.card{background:#1f2937;border-color:#374151}.note,.meta{color:#9ca3af}.progress{background:#374151}.empty{border-color:#4b5563;color:#9ca3af}}
    </style>
</head>
<body>
<main class="page">
    <header><h1>继续光媒接收</h1><button class="close" id="closeBtn" type="button" aria-label="关闭">×</button></header>
    <p class="note">未完成任务、实际数据残片和简易接收记录仅保存在当前设备，不通过 Node.js、Socket.IO 或隧道同步。</p>
    <section class="section"><h2>未完成光媒接收</h2><div class="list" id="tasks"></div></section>
    <section class="section"><h2>最近接收记录</h2><div class="list" id="receipts"></div></section>
</main>
<script src="/client/light-transfer.js"></script>
<script>
const fmt=n=>{n=Number(n)||0;if(n<1024)return n+' B';for(const u of ['KB','MB','GB','TB']){n/=1024;if(n<1024)return n.toFixed(n>=100?0:n>=10?1:2)+' '+u}return n.toFixed(1)+' PB'};
const dt=n=>n?new Date(Number(n)).toLocaleString():'-';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function closePage(){ if(parent!==window) parent.postMessage({type:'light-parts-close'},location.origin); else history.back(); }
document.getElementById('closeBtn').onclick=closePage;
async function render(){
  const api=window.Drop2TunnelLightTransfer;
  const [tasks,receipts]=await Promise.all([api.listTasks(),api.listReceipts()]);
  const taskEl=document.getElementById('tasks');
  taskEl.innerHTML=tasks.length?'':'<div class="empty">当前没有可继续的光媒残片任务</div>';
  for(const t of tasks){
    const got=Number(t.receivedCount)||0,total=Math.max(1,Number(t.blockCount)||1),pct=Math.min(100,got/total*100);
    const el=document.createElement('article');el.className='card task';el.tabIndex=0;
    el.innerHTML=`<div class="title">${esc(t.title||'光媒数据')}</div><div class="meta"><span>${esc(t.kind==='collection'?'文件合辑':'单文件')}</span><span>${got}/${total} 块 · ${pct.toFixed(1)}%</span><span>${fmt(t.totalSize)}</span><span>更新 ${dt(t.updatedAt)}</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="hash">${esc(t.taskId||'')}</div>`;
    const resume=()=>parent!==window?parent.postMessage({type:'light-transfer-resume',taskId:t.taskId},location.origin):location.assign('/?lightResume='+encodeURIComponent(t.taskId));
    el.onclick=resume;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();resume()}};taskEl.appendChild(el);
  }
  const receiptEl=document.getElementById('receipts');
  receiptEl.innerHTML=receipts.length?'':'<div class="empty">暂无已完成的光媒接收记录</div>';
  for(const r of receipts){
    const el=document.createElement('article');el.className='card';
    el.innerHTML=`<div class="title">${esc(r.title||'光媒数据')}</div><div class="meta"><span>${dt(r.completedAt)}</span><span>${Number(r.fileCount)||1} 个文件</span><span>${fmt(r.totalSize)}</span></div><div class="hash">${esc(r.taskId||'')}</div>${r.recordUrl?`<a class="link" href="${esc(r.recordUrl)}" target="_top">所在传输记录 ↗</a>`:''}`;
    receiptEl.appendChild(el);
  }
}
render().catch(err=>{document.getElementById('tasks').innerHTML='<div class="empty">读取本地光媒残片失败：'+esc(err.message)+'</div>'});
</script>
</body></html>

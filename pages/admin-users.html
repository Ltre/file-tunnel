<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>用户管理 · Drop2Tunnel</title><link rel="stylesheet" href="/client/admin-overview.css"><script defer src="/client/i18n-bootstrap.js"></script><script defer src="/client/i18n.js"></script><script defer src="/client/passkey-view.js"></script><script defer src="/client/admin-users.js"></script>
<style>
main{max-width:1200px;margin:auto;padding:24px}table{width:100%;border-collapse:collapse;background:#fff;color:#17212f;border-radius:8px}td,th{padding:12px;text-align:left;border-bottom:1px solid #dde5ed}th{white-space:nowrap;background:#f1f5f9}td small{display:block;color:#64748b}.actions{white-space:nowrap}button{cursor:pointer;border:1px solid #c6d2e6;border-radius:9px;padding:8px 12px;background:#f0f5ff;color:#233b68;font:inherit}button:hover{filter:brightness(.97)}button:disabled{opacity:.55;cursor:wait}.save-permissions{color:white;background:linear-gradient(135deg,#5579e6,#4158bf);border-color:#4056bc;box-shadow:0 3px 8px #4056bc30;margin-right:8px}.user-heading{display:flex;align-items:center;gap:12px}.user-heading h1{margin:0}#reload{font-size:25px;padding:1px 9px}#notice{min-height:24px;margin:14px 0}tr[aria-busy="true"]{opacity:.55}.permission-switch{display:inline-flex;gap:9px;align-items:center;white-space:nowrap}.permission-switch button{width:42px;height:24px;border:0;border-radius:15px;background:#8793a7;position:relative;padding:0;flex:none}.permission-switch button::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:white;box-shadow:0 1px 3px #0003;transition:transform .16s}.permission-switch button[aria-checked=true]{background:#4569dc}.permission-switch button[aria-checked=true]::after{transform:translateX(18px)}.permission-switch button:focus-visible{outline:3px solid #7199ee;outline-offset:3px}.risk-info{position:relative;display:inline-flex}.risk-info>button{width:21px;height:21px;border-radius:50%;padding:0;font-style:italic}.risk-tooltip{display:none;position:absolute;z-index:5;left:0;top:27px;width:min(420px,80vw);padding:14px;border:1px solid #bdcbe0;border-radius:10px;background:#fff;color:#233b55;box-shadow:0 8px 30px #122a4930;white-space:normal;font-weight:normal;line-height:1.6;overflow-wrap:anywhere}.risk-info>button:hover+.risk-tooltip,.risk-info>button:focus-visible+.risk-tooltip{display:block}.passkey-dialog{width:min(900px,90vw);max-height:85dvh;border:1px solid #c6d2e6;border-radius:16px;padding:22px;color:#17212f;box-shadow:0 20px 80px #10244d40}.passkey-dialog::backdrop{background:#172b4d70;backdrop-filter:blur(4px)}.passkey-dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px}.passkey-dialog .passkey-list{overflow:auto}.passkey-dialog table{font-size:14px}.passkey-dialog td{overflow-wrap:anywhere}.passkey-dialog button{margin:3px}@media(max-width:730px){.users-table{overflow-x:auto}main{padding:12px}}
.passkey-dialog{margin:auto}
.origin-editor{box-sizing:border-box;width:100%;min-height:150px;margin:12px 0;padding:12px;border:1px solid #b8c9df;border-radius:8px;font:15px/1.6 monospace}.origin-dependencies{max-height:200px;overflow:auto;white-space:pre-wrap}.user-heading{flex-wrap:wrap}
</style></head>
<body><main><div class="user-heading"><h1>用户管理</h1><button type="button" id="reload" aria-label="刷新用户列表" title="刷新用户列表">↻</button><button type="button" id="configureOrigins">ROR 域名配置</button></div><p>三项权限默认关闭。仅为明确指定的可信账号开启；权限变更立即由服务端生效。</p>
<p id="notice" role="status"></p>
<div class="users-table"><table><thead><tr><th>账号</th><th>S3 开关</th><th>风险文件上传 <span class="risk-info"><button type="button" aria-label="风险文件说明" aria-describedby="riskTooltip">i</button><span id="riskTooltip" class="risk-tooltip" role="tooltip"></span></span></th><th>网页 ZIP 创建／编辑／发送</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div>
</main></body></html>
